id: sim-09-ib-disabled
title: "Training over TCP: NCCL fell back to sockets"
level: 2
estimated_minutes: 20
lessons: [nccl-architecture, nccl-debugging, slow-collectives-stragglers]
summary: A debugging variable forces NCCL onto the management network.
start: node01
ticket: |
  **INC-4630 · Sev2 · Jobs 100x slower, no errors**

  > All jobs complete, but at a fraction of their normal speed, and nothing shows up in the logs. The
  > fabric team says the RoCE links are idle. - ML platform team
faults:
  - { type: nccl_conf, node: node04, set: { NCCL_IB_DISABLE: "1" } }
hints:
  - "If the RoCE links are idle, the traffic is going somewhere else. Set NCCL_DEBUG=INFO and look for the `Using network` line."
diagnosis:
  prompt: What happened?
  options:
    - id: a
      text: node04's /etc/nccl.conf contains NCCL_IB_DISABLE=1, so NCCL uses the socket transport over eno1 for the whole job.
      correct: true
      explanation: In this model, NCCL picks one network for the whole communicator, so with IB disabled on one rank the job runs on NET/Socket and the RoCE NICs sit idle.
    - id: b
      text: node04's RoCE NICs did not come up after a reboot, so NCCL finds no RDMA device and falls back to sockets.
      explanation: rdma link shows them ACTIVE and ib_write_bw from node04 works at line rate.
    - id: c
      text: GPUDirect RDMA is disabled on node04, so every transfer is staged through host memory before reaching the NIC.
      explanation: That costs some bandwidth, but RoCE would still be used and the links would not be idle.
    - id: d
      text: A typo in NCCL_IB_HCA on node04 matches no RDMA device, so NCCL silently falls back to the socket transport over eno1.
      explanation: "That failure exists (NCCL logs 'NET/IB : No device found.'), but here the INFO log says 'NCCL_IB_DISABLE set by environment to 1.' and node04's NCCL_IB_HCA is mlx5, which matches every NIC."
checks:
  - { description: "all_reduce runs on NET/IB above 360 GB/s", check: allreduce_min_busbw, args: { value: 360 } }
solution: |
  With `NCCL_DEBUG=INFO` the log shows `NCCL_IB_DISABLE set by environment to 1.` and
  `Using network Socket`. node04's
  nccl.conf contains `NCCL_IB_DISABLE=1`. Remove it with `sed -i '/NCCL_IB_DISABLE/d' /etc/nccl.conf`.
fix:
  - "node04: sed -i '/NCCL_IB_DISABLE/d' /etc/nccl.conf"
