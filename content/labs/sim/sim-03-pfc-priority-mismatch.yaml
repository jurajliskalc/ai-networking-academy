id: sim-03-pfc-priority-mismatch
title: "PFC on the wrong priority: fast in isolation, slow in a job"
level: 3
estimated_minutes: 40
lessons: [pfc-priority-flow-control, qos-trust-and-mapping, lossless-misconfigurations]
summary: One NIC enables PFC on priority 4 while the fabric uses priority 3 for RoCE.
start: node01
ticket: |
  **INC-4519 · Sev3 · Training throughput down 65 %**

  > Since node03 was re-imaged, multi-node jobs run at about a third of normal speed. We ran
  > `ib_write_bw` between node03 and its neighbours on every rail, and all eight report ~392 Gb/s. So the
  > network is fine, right? - ML platform team

  Explain why point-to-point tests pass while the collective is slow, then fix it.
faults:
  - { type: host_pfc, node: node03, rail: 5, prios: [4] }
hints:
  - A single ib_write_bw flow never congests the fabric, so it never needs PFC. A collective does.
  - "Run all_reduce_perf once, then compare `ethtool -S <if> | grep pause` across node03's interfaces. mlx5 only exposes per-priority pause counters for priorities that have PFC enabled."
  - "`mlnx_qos -i <if>` shows a NIC's per-priority PFC configuration."
diagnosis:
  prompt: What is the root cause?
  options:
    - id: a
      text: node03 mlx5_5 (enp170s0np0) enables PFC on priority 4 instead of 3, so it ignores the leaf's pause frames for RoCE and packets are dropped.
      correct: true
      explanation: RoCE is classified to priority 3 (DSCP 26). The leaf sends PFC pause frames for priority 3, but the NIC has PFC disabled there and keeps transmitting (it does not even expose priority-3 pause counters). The leaf buffer overflows, packets drop, and go-back-N retransmissions collapse throughput for every rank on that ring. A single ib_write_bw flow never congests the port, so it never needs PFC and still reaches line rate.
    - id: b
      text: leaf06 lost its RoCE QoS profile, so rail 5 runs in a lossy class and the leaf drops RoCE packets once a collective loads it.
      explanation: nv show qos roce on leaf06 shows lossless mode with PFC on priority 3, and the other nodes' rail-5 ports show ECN marks and no drops. Only the port facing node03 drops, while it sends hundreds of thousands of pause frames that are ignored.
    - id: c
      text: node03's re-image left enp170s0np0 trusting PCP, so untagged RoCE is classified to priority 0 on receive and never gets PFC protection.
      explanation: "mlnx_qos -i enp170s0np0 shows 'Priority trust state: dscp'. What is wrong is the PFC vector, which enables priority 4 instead of 3."
    - id: d
      text: The re-image flashed different ConnectX firmware on node03, and mlx5_5 now has a slower data path that throttles its ring.
      explanation: ib_write_bw on mlx5_5 reaches line rate (~392 Gb/s) and ibv_devinfo shows the same fw_ver as the other nodes, so the NIC data path is fine. The problem only appears under load, together with drops and out-of-sequence counters.
checks:
  - { description: "node03 mlx5_5 enables PFC on priority 3 only", check: host_pfc_only, args: { node: node03, rail: 5, prio: 3 } }
  - { description: "all_reduce bus bandwidth is above 360 GB/s", check: allreduce_min_busbw, args: { value: 360 } }
solution: |
  After one `all_reduce_perf` run, `ethtool -S <if> | grep pause` shows `rx_prio3_pause`/`tx_prio3_pause`
  on every healthy interface, but on node03 `enp170s0np0` only `prio4` pause counters exist: mlx5 exposes
  per-priority pause counters only where PFC is enabled. On leaf06, `nv show interface swp3 counters` shows
  hundreds of thousands of PFC pause frames sent toward node03, plus drops, and `rdma statistic show link
  mlx5_5/1` shows `out_of_sequence` and `packet_seq_err` climbing. `mlnx_qos -i
  enp170s0np0` reveals PFC enabled on priority 4. Fix: `mlnx_qos -i enp170s0np0 --pfc 0,0,0,1,0,0,0,0`.

  Lesson: point-to-point tests at low fan-in prove the data path, not the lossless configuration. Add a
  per-NIC QoS audit (trust, PFC vector, DSCP map) to node provisioning.
fix:
  - "node03: mlnx_qos -i enp170s0np0 --pfc 0,0,0,1,0,0,0,0"
