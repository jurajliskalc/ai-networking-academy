id: sim-12-trust-pcp
title: "Trust issues: a NIC that classifies by PCP on an untagged link"
level: 3
estimated_minutes: 30
lessons: [qos-trust-and-mapping, pfc-priority-flow-control, lossless-misconfigurations]
summary: One NIC trusts PCP, so untagged RoCE traffic is received in priority 0 and PFC never protects it.
start: node01
ticket: |
  **INC-4688 · Sev3 · node01 drags every job down**

  > node01 was swapped for an RMA unit and re-provisioned by hand. Jobs that include it are ~3x slower,
  > yet ib_write_bw is fine everywhere. - HPC operations
faults:
  - { type: host_trust, node: node01, rail: 0, trust: pcp }
hints:
  - "These host links are untagged (no VLAN), so there is no PCP field to trust."
  - "`mlnx_qos -i enp24s0np0` shows the trust state."
diagnosis:
  prompt: What is the root cause?
  options:
    - id: a
      text: node01 enp24s0np0 trusts PCP, so untagged RoCE arriving on it is classified as priority 0 and is never protected by PFC.
      correct: true
      explanation: With trust PCP and no 802.1Q tag, the NIC maps every received packet to the default priority. RoCE traffic arriving at node01 is not protected by PFC on priority 3, so the NIC never sends pause frames for it, drops packets under incast, and the senders retransmit.
    - id: b
      text: leaf01 trusts DSCP, but untagged host links need PCP trust, so RoCE from node01 misses the lossless queue on the leaf under load.
      explanation: DSCP trust is the right choice for routed, untagged RoCE fabrics (an untagged frame has no PCP field), and leaf01 serves the other three nodes without problems.
    - id: c
      text: node01 mlx5_0 lost PFC on priority 3 during manual provisioning, so it ignores the leaf's pause frames.
      explanation: mlnx_qos -i enp24s0np0 shows PFC enabled on priority 3, and the priority-3 pause counters exist in ethtool -S. What is wrong is the trust state.
    - id: d
      text: The RMA unit has a different PCIe/NUMA layout, so node01's GPUs reach mlx5_0 across sockets and slow the ring.
      explanation: nvidia-smi topo -m shows GPU0 and NIC0 (mlx5_0) connected through a single PCIe bridge (PIX), ib_write_bw is fine, and the counters show drops and out-of-sequence events on one NIC, which is a network symptom.
checks:
  - { description: "node01 mlx5_0 trusts DSCP", check: host_trust, args: { node: node01, rail: 0, trust: dscp } }
  - { description: "all_reduce bus bandwidth is above 360 GB/s", check: allreduce_min_busbw, args: { value: 360 } }
solution: |
  After a run, `ethtool -S enp24s0np0` on node01 shows RoCE arriving in `rx_prio0_packets`, and the
  RDMA counters show `out_of_sequence` growth. `mlnx_qos -i enp24s0np0` shows `Priority trust state:
  pcp`. Fix it with `mlnx_qos -i enp24s0np0 --trust dscp`.
fix:
  - "node01: mlnx_qos -i enp24s0np0 --trust dscp"
