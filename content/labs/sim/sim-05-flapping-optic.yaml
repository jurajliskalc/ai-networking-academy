id: sim-05-flapping-optic
title: "The optic that is almost working"
level: 3
estimated_minutes: 40
lessons: [link-layer-ber-fec, telemetry-counters, optics-cabling-power]
summary: A marginal transceiver passes traffic but corrupts enough of it to halve one rail.
start: node01
ticket: |
  **INC-4560 · Sev3 · Intermittent slowness, "the network is flaky"**

  > Throughput varies between runs and never reaches the old baseline. No links are down. Users report
  > occasional NCCL timeouts overnight. - ML platform team

  Identify the faulty component from evidence, then have it replaced with the lab action `replace-cable`.
faults:
  - { type: bad_cable, switch: leaf05, port: swp3, ber: 1.0e-5 }
hints:
  - "Run a test, then look for physical-layer errors: `ethtool -S <if> | grep -E 'symbol|corrected|crc|link_down'`. Compare with a healthy interface: some corrected bits are normal on PAM4 links."
  - "`mlxlink -d <dev> -c` shows raw and effective BER, `ethtool -m <if>` shows per-lane RX power, and `dmesg` shows link flaps."
diagnosis:
  prompt: Which evidence best identifies the root cause?
  options:
    - id: a
      text: node03 enp154s0np0 shows uncorrectable symbol errors, CRC errors, a raw BER of 3E-04 with post-FEC errors, one weak RX lane and link flaps, so the leaf05 swp3 optic or cable is bad.
      correct: true
      explanation: rx_pcs_symbol_err_phy counts symbols FEC could not correct, and a raw BER around 3E-04 is above what RS(544,514) FEC can correct, so post-FEC errors appear. Together with rising rx_crc_errors_phy, one lane at low RX power and link flaps in dmesg, everything points at the physical link. Corrupted packets are dropped and RDMA retransmits them, so that rail paces the collective.
    - id: b
      text: node03 enp154s0np0 shows rising rx_prio3_pause and tx_prio3_pause counters, and leaf05 swp3 is sending PFC pause frames, so rail 4 is congested and paced by pauses.
      explanation: Pause counters on this link are in the same range as on healthy links, and congestion does not produce CRC or symbol errors.
    - id: c
      text: out_of_sequence and packet_seq_err climbing on node03 mlx5_4 point at a ConnectX firmware bug that mis-orders RDMA packets on that NIC.
      explanation: out_of_sequence counts gaps in PSNs seen by the receiver. It is a consequence of the dropped (corrupted) packets, not a cause, and the same firmware runs on every NIC.
    - id: d
      text: node03 enp154s0np0 shows rx_corrected_bits_phy rising, which only proves that FEC is doing its job. The link is healthy and the slowdown lies elsewhere.
      explanation: Corrected bits alone are normal on PAM4 links, but this link also shows uncorrectable symbol errors, CRC errors, post-FEC errors, a weak lane and flaps. It is not healthy.
checks:
  - { description: "leaf05 swp3 link is clean (BER back to normal)", check: link_clean, args: { switch: leaf05, port: swp3 } }
  - { description: "all_reduce bus bandwidth is above 360 GB/s", check: allreduce_min_busbw, args: { value: 360 } }
solution: |
  `ib_write_bw` from node03 on `mlx5_4` reaches only ~215 Gb/s. `ethtool -S enp154s0np0` shows symbol
  and CRC errors, `mlxlink -d mlx5_4 -c` reports a raw BER of 3E-04, above the roughly 2.4E-4 that RS(544,514) FEC can correct, so effective (post-FEC) errors are non-zero,
  `ethtool -m` shows one lane at -10.9 dBm, and `dmesg` shows repeated link down/up. Have the optic or
  cable replaced: `replace-cable leaf05 swp3`.

  In production: drain the node or shut the port first, clean and inspect the connectors, swap the
  optic, then the cable, and track BER per link over time to catch degradation early.
fix:
  - "node01: replace-cable leaf05 swp3"
