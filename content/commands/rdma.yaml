id: rdma
title: RDMA and rdma-core
description: rdma-core, iproute2 rdma and NVIDIA OFED/DOCA helper commands for checking RDMA devices, ports, GIDs, counters and basic connectivity.
commands:
  - cmd: ibv_devices
    platform: rdma
    summary: List RDMA devices visible to user space with their node GUIDs.
    example: |
      # illustrative output
          device                 node GUID
          ------              ----------------
          mlx5_0              b83fd20300aabb01
          mlx5_1              b83fd20300aabb11
    notes: "Device names depend on the driver stack: NVIDIA's DOCA/MLNX_OFED names them mlx5_0, mlx5_1, ...; distribution rdma-core renames them from the PCI address, for example rocep59s0f0 for 0000:3b:00.0. Take the name from this list or from 'rdma link' rather than assuming mlx5_0 (tools given a wrong name report that the device was not found). If a device is missing, check that the kernel driver (for example mlx5_ib) is loaded and that rdma-core user-space providers are installed."
    tags: [rdma-core, inventory]

  - cmd: ibv_devinfo
    platform: rdma
    summary: Show each RDMA device's firmware, port state, active MTU, link layer and LID.
    example: |
      # illustrative output (trimmed)
      hca_id: mlx5_0
              transport:                      InfiniBand (0)
              fw_ver:                         28.41.1000
              node_guid:                      b83f:d203:00aa:bb01
              vendor_id:                      0x02c9
              vendor_part_id:                 4129
              board_id:                       MT_0000000838
              phys_port_cnt:                  1
                      port:   1
                              state:                  PORT_ACTIVE (4)
                              max_mtu:                4096 (5)
                              active_mtu:             4096 (5)
                              sm_lid:                 0
                              port_lid:               0
                              port_lmc:               0x00
                              link_layer:             Ethernet
    notes: "link_layer tells you RoCE (Ethernet) vs InfiniBand. On IB, port_lid 0 or state PORT_INIT usually means no subnet manager has configured the port. On RoCE, active_mtu below 4096 usually means the netdev MTU is too small. 'transport: InfiniBand' is printed for RoCE devices too: it refers to the IB transport layer. vendor_part_id identifies the chip (4119 ConnectX-5, 4129 ConnectX-7). Asking for a device that does not exist (-d mlx5_0 on a host whose device is called rocep59s0f0) prints: IB device 'mlx5_0' wasn't found."
    tags: [rdma-core, verify, mtu]

  - cmd: ibv_devinfo -d mlx5_0 -v
    platform: rdma
    summary: Verbose capabilities for one device, including max QPs, max MR size, atomic support, and on RoCE the GID table.
    notes: "Long output; pipe to less or grep. On RoCE the GID table appears as lines such as 'GID[  3]: ::ffff:10.0.0.11, RoCE v2'. Useful when an application fails because it requests more QPs, CQ entries or MR size than the device supports."
    tags: [rdma-core, capabilities]

  - cmd: ibdev2netdev -v
    platform: rdma
    summary: NVIDIA OFED/DOCA helper script that maps RDMA devices to network interfaces and shows link state.
    example: |
      # illustrative output as a normal user (the card's VPD needs root)
      cat: /sys/class/infiniband/mlx5_0/device/vpd: Permission denied
      0000:3b:00.0 mlx5_0 (MT4129 -            )                 fw 28.41.1000 port 1 (ACTIVE) ==> ens1f0np0 (Up)
      # without -v
      mlx5_0 port 1 ==> ens1f0np0 (Up)
    notes: "Shipped with MLNX_OFED/DOCA-Host (mlnx-tools), not with upstream rdma-core or the distribution archives. Run as root to fill the blank fields from the card's VPD. The upstream equivalent is 'rdma link show', which prints the netdev for each RDMA port."
    tags: [ofed, doca, inventory, mapping]

  - cmd: rdma link show
    platform: rdma
    summary: iproute2 view of every RDMA port with state, physical state and the associated netdev.
    example: |
      # illustrative output
      link mlx5_0/1 state ACTIVE physical_state LINK_UP netdev ens1f0np0
      link mlx5_1/1 state DOWN physical_state DISABLED netdev ens2f0np0
      # the first port on a host with distribution rdma-core names
      link rocep59s0f0/1 state ACTIVE physical_state LINK_UP netdev ens1f0np0
    notes: Available without OFED, and the place to read the RDMA device name on your host (mlx5_N with NVIDIA's stack, rocep<bus>s<slot>f<fn> with distribution rdma-core). state ACTIVE plus physical_state LINK_UP is what you want; physical_state DISABLED means the netdev is administratively down; physical_state POLLING means the port is trying to train (cable or peer issue).
    tags: [iproute2, rdma, verify, mapping]

  - cmd: rdma dev show
    platform: rdma
    summary: List RDMA devices with node type, firmware version and GUIDs.
    example: |
      # illustrative output
      0: mlx5_0: node_type ca protocol roce fw 28.41.1000 node_guid b83f:d203:00aa:bb01 sys_image_guid b83f:d203:00aa:bb01
    notes: protocol shows roce or ib for each device; -j prints JSON.
    tags: [iproute2, rdma, inventory]

  - cmd: rdma resource show qp
    platform: rdma
    summary: List RDMA queue pairs currently allocated, with their state, type, owning process and peer QP number.
    example: |
      # illustrative output on an idle host (only the kernel's GSI QP)
      link mlx5_0/1 lqpn 1 type GSI state RTS sq-psn 0 comm [ib_core]
      # per-device totals
      $ rdma resource show
      0: mlx5_0: pd 3 cq 4 qp 1 cm_id 0 mr 0 ctx 0 srq 2
    notes: "QPs of running applications (NCCL, perftest and so on) show up as extra lines with type RC, the remote QP number, PSNs and the owning process. 'rdma resource show' (no object) gives per-device totals of PDs, CQs, QPs, MRs. A QP stuck in ERR or a growing QP count across job restarts can reveal leaks or failed connections. Requires a kernel and iproute2 recent enough to support resource tracking."
    tags: [iproute2, rdma, qp, troubleshooting]

  - cmd: rdma statistic show link mlx5_0/1
    platform: rdma
    summary: Show the port's RDMA hardware counters (on mlx5 these include out_of_buffer, out_of_sequence, packet_seq_err, local_ack_timeout_err, np_cnp_sent, rp_cnp_handled, np_ecn_marked_roce_packets).
    example: |
      # illustrative output (recent iproute2, trimmed, values made up)
      link mlx5_0/1
          rx_write_requests 0
          rx_read_requests 0
          out_of_buffer 0
          out_of_sequence 12
          rnr_nak_retry_err 0
          packet_seq_err 0
          local_ack_timeout_err 0
          req_transport_retries_exceeded 0
          roce_adp_retrans 0
          rp_cnp_ignored 0
          rp_cnp_handled 90233
          np_ecn_marked_roce_packets 88412
          np_cnp_sent 88019
          rx_icrc_encapsulated 0
    notes: "Recent iproute2 prints one counter per line as above; older versions printed them all on the link line, so scripts should not depend on the layout (-j gives JSON). Counter names are driver-specific (these are mlx5). Read as deltas. np_* counters are the receiver ('notification point') side of DCQCN, rp_* the sender ('reaction point'). Rising out_of_sequence or local_ack_timeout_err on RoCE usually means packet loss in the fabric; rising CNP counters mean ECN congestion control is active. Back to back without a switch nothing marks ECN, so the CNP counters stay at 0."
    tags: [iproute2, counters, dcqcn, roce, troubleshooting]

  - cmd: ls /sys/class/infiniband/mlx5_0/ports/1/hw_counters/
    platform: rdma
    summary: The same driver hardware counters exposed as sysfs files; the standard IB port counters live in ../counters/.
    example: |
      # read one counter
      $ cat /sys/class/infiniband/mlx5_0/ports/1/hw_counters/out_of_sequence
      12
    notes: Handy for scripts and exporters; the file names match the rdma statistic counter names. ports/1/counters/ holds the IB PortCounters (port_xmit_data, port_rcv_data in 4-byte units, symbol_error, link_downed, port_rcv_errors, port_xmit_discards, ...). Exact file sets depend on driver and kernel.
    tags: [sysfs, counters, telemetry]

  - cmd: cat /sys/class/infiniband/mlx5_0/ports/1/gid_attrs/types/3
    platform: rdma
    summary: Show the RoCE version of one GID table entry (index 3 here); the sibling gid_attrs/ndevs/3 shows its netdev and gids/3 the GID value.
    example: |
      # illustrative output
      RoCE v2
    notes: "This is what show_gids reads under the hood, and the way to read the GID table without NVIDIA's tools. The type strings are 'IB/RoCE v1' and 'RoCE v2'. On a ConnectX port with one IPv4 address the usual layout is 0 link-local RoCE v1, 1 link-local RoCE v2, 2 IPv4-mapped RoCE v1, 3 IPv4-mapped RoCE v2. Reading an unpopulated index typically returns an error (behaviour can vary by kernel), which is normal."
    tags: [sysfs, gid, roce]

  - cmd: show_gids
    platform: rdma
    summary: NVIDIA OFED/DOCA helper script that prints the GID table of every RDMA port with index, GID, IPv4 address, RoCE version and netdev.
    example: |
      # illustrative output
      DEV     PORT    INDEX   GID                                     IPv4            VER     DEV
      ---     ----    -----   ---                                     ------------    ---     ---
      mlx5_0  1       0       fe80:0000:0000:0000:ba3f:d2ff:feaa:bb01                 v1      ens1f0np0
      mlx5_0  1       1       fe80:0000:0000:0000:ba3f:d2ff:feaa:bb01                 v2      ens1f0np0
      mlx5_0  1       2       0000:0000:0000:0000:0000:ffff:0a00:000b 10.0.0.11       v1      ens1f0np0
      mlx5_0  1       3       0000:0000:0000:0000:0000:ffff:0a00:000b 10.0.0.11       v2      ens1f0np0
      n_gids_found=4
    notes: "Pick the index whose VER is v2 and whose IPv4 is the routable address; that is the value for NCCL_IB_GID_INDEX or perftest -x. The index is commonly 3 on a single-IP interface but is not guaranteed: it changes if addresses, VLANs or IPv6 addresses are added. Not part of upstream rdma-core or the distribution archives (it comes with DOCA/MLNX_OFED); if absent, read gids/N, gid_attrs/types/N and gid_attrs/ndevs/N in sysfs."
    tags: [ofed, doca, gid, roce]

  - cmd: cma_roce_mode -d mlx5_0 -p 1 -m 2
    platform: rdma
    summary: NVIDIA OFED/DOCA script that sets the default RoCE version used by RDMA CM connections on a port (-m 2 = RoCEv2); without -m it shows the current mode.
    notes: "Run as root; it prints the resulting mode (RoCE v2). Options are -d device, -p port and -m 1 or 2 (check -h on your version). Affects only connections set up through RDMA CM (librdmacm), not applications that pick a GID index themselves (NCCL, perftest without -R). The setting is held in configfs and is not persistent across reboot unless your provisioning reapplies it. Without NVIDIA's tools, use configfs directly: mkdir /sys/kernel/config/rdma_cm/<dev> (modprobe configfs first if needed), then read or write ports/1/default_roce_mode (default RoCE v2)."
    tags: [ofed, doca, rdma-cm, roce]

  - cmd: cma_roce_tos -d mlx5_0 -t 106
    platform: rdma
    summary: NVIDIA OFED/DOCA script that sets the default IP ToS byte for RDMA CM connections on a device (106 = DSCP 26 with ECN-capable bits set).
    notes: "ToS is DSCP shifted left 2 bits plus the 2 ECN bits: DSCP 26 << 2 = 104, +2 for ECT(0) = 106. Only RDMA CM traffic picks this up; NCCL sets its own traffic class via NCCL_IB_TC. Run as root; it prints the value, and without -t shows the current one (default 0). Without NVIDIA's tools the same setting is one configfs file: after mkdir /sys/kernel/config/rdma_cm/<dev>, write the value to ports/1/default_roce_tos."
    tags: [ofed, doca, rdma-cm, qos, dscp]

  - cmd: ibv_rc_pingpong -d mlx5_0 -g 3
    platform: rdma
    summary: Minimal RC QP ping-pong test from rdma-core examples. Run with no host on the server and with the server's address on the client.
    example: |
      # server:  ibv_rc_pingpong -d mlx5_0 -g 3
      # client:  ibv_rc_pingpong -d mlx5_0 -g 3 10.0.0.11
      # illustrative client output
        local address:  LID 0x0000, QPN 0x00011a, PSN 0x5c1e2a, GID ::ffff:10.0.0.12
        remote address: LID 0x0000, QPN 0x00021b, PSN 0x8a1f03, GID ::ffff:10.0.0.11
      8192000 bytes in 0.01 seconds = 6213.11 Mbit/sec
      1000 iters in 0.01 seconds = 10.55 usec/iter
    notes: "Proves end-to-end RC connectivity. -d device, -i IB port, -g GID index (required on RoCE), -s message size, -n iterations, -m path MTU. The QP information is exchanged over a TCP socket (default port 18515), so that port must be reachable. Both sides need matching GID kinds: a client with -g 0 against a server with -g 3 fails with 'client read/write: No space left on device' and 'Couldn't read/write remote address'. Not a performance tool; use perftest for that."
    tags: [rdma-core, connectivity, verify]

  - cmd: rping -s -a 0.0.0.0 -v -C 5
    platform: rdma
    summary: librdmacm ping test server; pair it with a client "rping -c -a <server-ip> -v -C 5". Exercises RDMA CM address and route resolution.
    example: |
      # client: rping -c -a 10.0.0.11 -v -C 5
      # illustrative output (the client may also print 'client DISCONNECT EVENT...')
      ping data: rdma-ping-0: ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqr
      ping data: rdma-ping-1: BCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrs
    notes: "Part of librdmacm-utils (rdmacm-utils on Ubuntu), which is often not installed by default. -s server, -c client, -a address, -v print ping data, -C count. Because it uses RDMA CM it validates IP routing, ARP and GID selection; if ibv_rc_pingpong works but rping fails, suspect routing/ARP or the RDMA CM RoCE mode."
    tags: [librdmacm, rdma-cm, connectivity]

  - cmd: rdma system show
    platform: rdma
    summary: Show system-wide RDMA settings such as the network namespace mode (shared or exclusive).
    example: |
      # illustrative output (the fields after netns depend on the iproute2 and kernel version)
      netns shared privileged-qkey off monitor on copy-on-fork on
    notes: In exclusive mode RDMA devices must be moved into a container's network namespace (rdma dev set <dev> netns <ns>); relevant to Kubernetes and multi-tenant setups.
    tags: [iproute2, namespaces, containers]

  - cmd: rdma link add rxe0 type rxe netdev eth0
    platform: rdma
    summary: Create a Soft-RoCE (rdma_rxe) device on top of an ordinary Ethernet interface, for labs without RDMA hardware.
    notes: Load the module first with "modprobe rdma_rxe". Remove with "rdma link delete rxe0". Soft-RoCE is for learning and functional testing; performance is limited by the CPU.
    tags: [soft-roce, rxe, lab]
