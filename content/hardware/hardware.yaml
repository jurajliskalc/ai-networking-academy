# Real hardware track: tiers, requirement keys and lab-profile variables.
#
# Variables are shared by three consumers, so their names never change once published:
#   - lab and guide Markdown: {{NAME}} placeholders, replaced in the browser with the learner's profile
#   - lab.env (generated by the Connect page, read by labs/hw-toolkit and every hardware check.sh)
#   - the Connect page form
# `derived` variables are computed from others and are not editable.

tiers:
  - id: 0
    title: Virtual
    summary: Any Linux VM or spare PC. Soft-RoCE, containerlab and kernel tooling, no RDMA hardware.
    gear: One Ubuntu 24.04 VM (4 vCPU, 8 GB RAM). Two VMs for the packet-capture lab.
  - id: 1
    title: Two RDMA hosts
    summary: Two servers with RDMA NICs, cabled back to back or through any switch. Real RoCEv2 (or InfiniBand) traffic, host QoS, link health.
    gear: Two x86_64 servers, one RDMA-capable NIC each (for example ConnectX-4 Lx or newer), one DAC or AOC cable.
  - id: 2
    title: Lossless switched fabric
    summary: Three hosts behind a switch you can configure for PFC and ECN. Incast, pause frames, ECN marking and congestion control.
    gear: Three RDMA hosts and one data-center switch with PFC and ECN support (and its documentation).
  - id: 3
    title: GPU nodes
    summary: Two hosts with NVIDIA GPUs and RDMA NICs. GPUDirect RDMA, PCIe affinity and multi-node NCCL tests.
    gear: Two GPU servers (one GPU each is enough), each with an RDMA NIC, ideally under the same PCIe switch or root complex as the GPU.

requirements:
  - id: linux-vm
    title: A Linux VM or spare PC
    description: Ubuntu 24.04 with sudo rights. Nothing else.
  - id: two-rdma-hosts
    title: Two hosts with RDMA NICs
    description: Two Linux servers, each with an RDMA-capable NIC (RoCE or InfiniBand), connected to each other directly or through a switch.
  - id: three-rdma-hosts
    title: Three hosts with RDMA NICs
    description: Needed to create real incast (two senders, one receiver) through a switch.
  - id: lossless-switch
    title: A switch with PFC and ECN
    description: A data-center switch whose QoS you can configure (lossless priority, PFC, ECN marking). Cumulus Linux and SONiC examples are given; other NOSes follow the same checklist.
  - id: gpu
    title: NVIDIA GPUs
    description: At least one NVIDIA GPU per host, with the driver installed, in the same hosts as the RDMA NICs.
  - id: infiniband
    title: InfiniBand HCAs
    description: InfiniBand adapters (or VPI adapters set to InfiniBand), cabled back to back or through an InfiniBand switch, and a subnet manager.
  - id: root
    title: Root on the hosts
    description: Labs that change NIC or kernel settings need sudo. Each one saves the original state and ships a restore script.
  - id: ssh-mesh
    title: SSH from host A to the others
    description: Key-based SSH from host A to hosts B and C, so check scripts can start the remote side of a test.

variables:
  - { name: LAB_NAME, group: lab, label: Lab name, default: my-lab, help: Free text. Appears in reports and generated files. }
  - { name: FABRIC, group: lab, label: Fabric, default: roce, choices: [roce, ib], help: "roce = RoCEv2 over Ethernet, ib = InfiniBand." }
  - { name: SSH_USER, group: lab, label: SSH user, default: "", help: "User that host A uses to reach hosts B and C over SSH. Empty means your current user (or whatever ~/.ssh/config says)." }
  - { name: AINA_DIR, group: lab, label: Academy checkout on the hosts, default: ~/ai-networking-academy, help: Where the repository is cloned on every host (the same path on all of them). }

  - { name: HOST_COUNT, group: hosts, label: Number of hosts, default: "2", choices: ["2", "3"], help: Tier 1 and 3 labs use two hosts; Tier 2 labs use three. }
  - { name: HOST_A, group: hosts, label: Host A name, default: node-a, help: Hostname or management IP reachable over SSH. Host A runs the check scripts and the servers of client/server tests. }
  - { name: HOST_B, group: hosts, label: Host B name, default: node-b }
  - { name: HOST_C, group: hosts, label: Host C name, default: node-c, help: Only Tier 2 labs use a third host. }
  - { name: A_IP, group: hosts, label: Host A data IP, default: 192.168.50.11, help: IPv4 address on the RDMA interface (not the management network). }
  - { name: B_IP, group: hosts, label: Host B data IP, default: 192.168.50.12 }
  - { name: C_IP, group: hosts, label: Host C data IP, default: 192.168.50.13 }
  - { name: PREFIX_LEN, group: hosts, label: Data subnet prefix length, default: "24" }
  - { name: A_NETDEV, group: hosts, label: Host A RDMA netdev, default: ens1f0np0, help: "The Ethernet interface of the RDMA port (rdma link show prints it). Leave as-is on InfiniBand if you use IPoIB: then it is the ib0-style interface." }
  - { name: B_NETDEV, group: hosts, label: Host B RDMA netdev, default: ens1f0np0 }
  - { name: C_NETDEV, group: hosts, label: Host C RDMA netdev, default: ens1f0np0 }
  - { name: A_RDMA_DEV, group: hosts, label: Host A RDMA device, default: mlx5_0, help: "Name from rdma link or ibv_devices. NVIDIA's DOCA/MLNX_OFED stack names devices mlx5_0, mlx5_1, ...; distribution rdma-core names them from the PCI address, for example rocep3s0f0. Use what your host prints." }
  - { name: B_RDMA_DEV, group: hosts, label: Host B RDMA device, default: mlx5_0 }
  - { name: C_RDMA_DEV, group: hosts, label: Host C RDMA device, default: mlx5_0 }
  - { name: RDMA_PORT, group: hosts, label: RDMA port number, default: "1" }

  - { name: MTU, group: qos, label: Netdev MTU, default: "9000", help: "Data-interface MTU on every host. 9000 gives an RDMA path MTU of 4096; the switch MTU must be at least this (9216 is common)." }
  - { name: GID_INDEX, group: qos, label: RoCEv2 GID index, default: "3", help: "Index of the RoCE v2 IPv4 entry in the GID table (the Inventory lab shows how to find it). 3 is common on ConnectX defaults but not guaranteed." }
  - { name: ROCE_PRIO, group: qos, label: Lossless priority, default: "3", help: Priority (0-7) with PFC enabled for RoCE traffic. Must match the switch. }
  - { name: ROCE_DSCP, group: qos, label: RoCE DSCP, default: "26", help: DSCP stamped on RoCE data packets and mapped to the lossless priority. }
  - { name: CNP_DSCP, group: qos, label: CNP DSCP, default: "48", help: "DSCP of congestion notification packets. 48 is a common convention and the mlx5 default with NVIDIA's stack (/sys/class/net/<netdev>/ecn/roce_np/cnp_dscp); check your NIC and switch." }
  - { name: TCLASS, group: qos, label: Traffic class byte, derived: "ROCE_DSCP * 4 + 2", help: "DSCP shifted left by two plus ECT(0): the value for perftest --tclass and NCCL_IB_TC." }

  - { name: SWITCH, group: switch, label: Switch name, default: leaf1, help: Leave the defaults if you cable back to back. }
  - { name: SWITCH_OS, group: switch, label: Switch OS, default: none, choices: [none, cumulus, sonic, other], help: "none = back-to-back cabling, no switch." }
  - { name: SWITCH_MGMT, group: switch, label: Switch management address, default: 10.0.0.2 }
  - { name: A_SWITCH_PORT, group: switch, label: Switch port facing host A, default: swp1, help: Cumulus names ports swpN, SONiC EthernetN. }
  - { name: B_SWITCH_PORT, group: switch, label: Switch port facing host B, default: swp2 }
  - { name: C_SWITCH_PORT, group: switch, label: Switch port facing host C, default: swp3 }

  - { name: GPUS_PER_NODE, group: gpu, label: GPUs per host used by tests, default: "1" }
  - { name: GPU_INDEX, group: gpu, label: GPU next to the NIC, default: "0", help: "CUDA index of the GPU closest to the NIC (nvidia-smi topo -m shows it). Used for GPUDirect tests." }
  - { name: NCCL_TESTS_DIR, group: gpu, label: nccl-tests build directory, default: ~/nccl-tests/build, help: Same path on both hosts. }
