id: quiz-storage-and-frontend-networks
title: "Knowledge check: Storage, front-end and management networks"
lesson: storage-and-frontend-networks
pass_pct: 70
questions:
  - id: q1
    type: scenario
    prompt: >
      A 175-billion-parameter model is trained with mixed precision and Adam. Assume 14 bytes of
      checkpoint state per parameter and a 90 s target for the synchronous checkpoint. What
      aggregate write bandwidth do you need?
    options:
      - id: a
        text: About 27 GB/s (about 218 Gb/s).
        correct: true
        explanation: 175 x 10^9 x 14 = 2.45 TB; 2,450 GB / 90 s = 27.2 GB/s; x 8 = 217.8 Gb/s.
      - id: b
        text: About 3.9 GB/s (about 31 Gb/s).
        explanation: That uses 2 bytes per parameter (weights only), ignoring master weights and optimizer state.
      - id: c
        text: About 218 GB/s.
        explanation: This confuses gigabits with gigabytes; 218 is the Gb/s figure.
      - id: d
        text: About 2.45 TB/s.
        explanation: 2.45 TB is the checkpoint size, not a rate; it must be divided by 90 s.
    tags: [checkpoint, sizing]
  - id: q2
    type: scenario
    prompt: >
      You build a storage fabric for 64 nodes, each with 2 x 400G storage ports, using 64-port 400G
      leaves at 3:1 (48 down, 16 up). The storage backend delivers about 200 GB/s. How many node-facing
      leaves do you need, and is the uplink capacity adequate?
    options:
      - id: a
        text: 3 leaves; 48 uplinks x 400G = 19.2 Tb/s (2.4 TB/s), about 12 times the backend, so adequate.
        correct: true
        explanation: ceil(128 / 48) = 3; 3 x 16 = 48 uplinks; 200 GB/s = 1.6 Tb/s, so uplinks have about 12x headroom.
      - id: b
        text: 2 leaves; 32 uplinks, adequate.
        explanation: 2 leaves give only 96 down-ports for 128 node ports.
      - id: c
        text: 4 leaves; uplinks inadequate because they are below 1:1.
        explanation: 3 leaves suffice; and 1:1 is not required when the backend is far slower than the uplinks.
      - id: d
        text: 3 leaves; 48 uplinks, inadequate because 19.2 Tb/s is less than 200 GB/s.
        explanation: 200 GB/s is only 1.6 Tb/s; 19.2 Tb/s is much larger.
    tags: [storage-fabric, oversubscription]
  - id: q3
    type: single
    prompt: What does GPUDirect Storage remove from the data path?
    options:
      - id: a
        text: The bounce buffer in CPU system memory between storage and GPU memory.
        correct: true
        explanation: GDS lets the NIC or NVMe device DMA directly to or from GPU memory.
      - id: b
        text: The need for a filesystem.
        explanation: GDS works through supported filesystems and the cuFile API; it does not replace them.
      - id: c
        text: The storage network itself, by using NVLink to reach storage.
        explanation: Remote storage still travels over the storage network.
      - id: d
        text: All PCIe transfers.
        explanation: Data still crosses PCIe; it just avoids the extra hop through host memory.
    tags: [gds]
  - id: q4
    type: scenario
    prompt: >
      In a cluster where storage traffic shares the compute NICs and fabric, nccl-tests bus bandwidth
      during training drops by about 30% for one to two minutes every 30 minutes. What is the most
      likely cause and remedy?
    options:
      - id: a
        text: Synchronized checkpoint writes collide with collectives; move storage to a separate fabric or give it an isolated class with guaranteed bandwidth.
        correct: true
        explanation: The period matches the checkpoint interval and the converged design is the root cause.
      - id: b
        text: The subnet manager re-sweeps every 30 minutes; disable it.
        explanation: Light sweeps do not cause minute-long bandwidth drops, and an InfiniBand fabric needs a running SM.
      - id: c
        text: GPU thermal throttling; improve cooling.
        explanation: Would not appear as a precise periodic network bandwidth drop tied to checkpoints.
      - id: d
        text: ECMP rehashing on the spine; increase the MTU.
        explanation: MTU does not influence hashing, and nothing triggers periodic rehashing here.
    tags: [converged, troubleshooting]
  - id: q5
    type: scenario
    prompt: >
      A GDS read benchmark shows high CPU utilization and throughput similar to a normal
      buffered read. What is the most likely explanation?
    options:
      - id: a
        text: cuFile is running in compatibility mode through host memory because a GDS prerequisite (kernel module, supported mount or PCIe affinity) is missing.
        correct: true
        explanation: Compatibility mode works but uses the CPU bounce path; check with the GDS tools and fix the prerequisite.
      - id: b
        text: GDS always uses more CPU than buffered I/O.
        explanation: Reducing CPU involvement is one of GDS's goals.
      - id: c
        text: The compute fabric is oversubscribed.
        explanation: The compute fabric is not on the storage path in a separate-fabric design.
      - id: d
        text: The GPU has too little memory for GDS.
        explanation: Memory size does not switch GDS into the bounce path.
    tags: [gds, troubleshooting]
  - id: q6
    type: multi
    prompt: Which traffic normally belongs on the front-end (in-band) network? Select all that apply.
    options:
      - id: a
        text: Kubernetes API and Slurm control traffic.
        correct: true
        explanation: Cluster control is in-band management traffic.
      - id: b
        text: Container image pulls.
        correct: true
        explanation: Registries and object stores live on the front-end side.
      - id: c
        text: User inference requests for an inference cluster.
        correct: true
        explanation: North-south user traffic enters through the front end.
      - id: d
        text: Tensor-parallel all-reduce between GPUs.
        explanation: Collectives belong on NVLink or the compute fabric.
      - id: e
        text: BMC power-cycle commands.
        explanation: BMCs are reached through the out-of-band network.
    tags: [frontend]
  - id: q7
    type: scenario
    prompt: >
      512 nodes each pull a 15 GB container image at job start from a registry that can serve
      2 x 100G (25 GB/s total). Ignoring caching, about how long does the pull take?
    options:
      - id: a
        text: About 5 minutes.
        correct: true
        explanation: 512 x 15 GB = 7,680 GB; 7,680 / 25 = 307 s, about 5 minutes. Caches or peer-to-peer distribution fix this.
      - id: b
        text: About 0.6 s.
        explanation: That divides one image by the registry bandwidth and ignores the 512 nodes.
      - id: c
        text: About 41 minutes.
        explanation: That treats the registry as 25 Gb/s (3.125 GB/s) instead of 25 GB/s; 7,680 / 3.125 = 2,458 s.
      - id: d
        text: About 30 s.
        explanation: Off by an order of magnitude; recompute 7,680 GB / 25 GB/s.
    tags: [frontend, sizing]
  - id: q8
    type: single
    prompt: Which design principle matters most for the out-of-band network?
    options:
      - id: a
        text: It must be self-contained and keep working when the cluster's in-band services are down.
        correct: true
        explanation: OOB exists for recovery; dependencies on cluster DNS or authentication defeat it.
      - id: b
        text: It must be non-blocking 1:1.
        explanation: OOB traffic is tiny; bandwidth ratios are irrelevant.
      - id: c
        text: It must run RoCEv2 with PFC.
        explanation: OOB is simple 1GbE management traffic; no RDMA.
      - id: d
        text: It should share switches with the compute fabric to save cost.
        explanation: Sharing fate with the data path is exactly what OOB is meant to avoid.
    tags: [oob]
