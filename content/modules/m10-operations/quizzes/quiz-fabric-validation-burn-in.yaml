id: quiz-fabric-validation-burn-in
title: "Knowledge check: fabric validation and burn-in"
lesson: fabric-validation-burn-in
pass_pct: 70
questions:
  - id: q1
    type: scenario
    prompt: >
      In concurrent ib_write_bw rounds, node-0457 NIC 3 measures about 190 Gb/s with every partner, while all
      other NICs reach about 370 Gb/s on 400 Gb/s links. Link speed shows 400G. What do you check first?
    options:
      - id: a
        text: The NIC's PCIe link status (lspci -vv LnkSta vs LnkCap) and its NUMA/topology placement.
        correct: true
        explanation: Slow with every partner localizes the fault to that NIC or host. About half bandwidth with a healthy link is the signature of a PCIe link that trained at half width or a lower generation.
      - id: b
        text: The leaf-to-spine uplinks, because cross-leaf paths are oversubscribed and cap this NIC's flows.
        explanation: A spine or uplink problem would affect many pairs crossing it, not one NIC with every partner, including partners on the same leaf.
      - id: c
        text: The NCCL version and NCCL_IB_HCA setting on the node, since a wrong HCA list halves bandwidth.
        explanation: ib_write_bw is a perftest tool that uses the verbs layer directly; the NCCL version and NCCL_* variables play no part in its result.
      - id: d
        text: The leaf's ECN marking thresholds, since early marking makes DCQCN throttle this NIC to half rate.
        explanation: The other NICs on the same fabric reach full rate, and congestion control reacts to congestion on shared paths; it would not cap a single NIC at half rate with every partner.
    tags: [perftest, pcie]
  - id: q2
    type: scenario
    prompt: >
      nccl-tests all_reduce large-message busbw is at the reference value for 2 nodes and for one 32-node
      scalable unit, but drops by 20 % when two scalable units are combined. Where is the problem most likely?
    options:
      - id: a
        text: The layer that joins scalable units, such as a failed or miscabled spine uplink or ECMP hash collisions.
        correct: true
        explanation: Scaling in steps localizes faults to the layer added at the step where performance drops; combining two scalable units is the first step that uses the spine layer between them.
      - id: b
        text: Inside the nodes on NVLink, because more nodes push more intra-node traffic through NVSwitch.
        explanation: Single-node and one-SU tests passed and exercise NVLink the same way; intra-node load per GPU does not grow with node count.
      - id: c
        text: In the GPU driver or CUDA version on the nodes, which limits how many peers each rank can reach.
        explanation: A driver problem would show at small scales too, and drivers impose no peer limit that appears only at two scalable units.
      - id: d
        text: Nowhere; in a ring all-reduce busbw is expected to fall roughly in proportion to the number of nodes added.
        explanation: busbw is normalized for the algorithm. For a well-built non-blocking fabric large-message busbw should stay roughly flat with scale.
    tags: [nccl-tests, scale]
  - id: q3
    type: single
    prompt: Why must cabling be validated against a plan even when every link is up at the right speed?
    options:
      - id: a
        text: Swapped or misplaced cables (for example a NIC on another rail's leaf) still link up but break the intended topology.
        correct: true
        explanation: Link state says nothing about where a cable lands, yet misplacement breaks rail alignment and performance. LLDP or IB topology discovery compared to the source of truth catches it.
      - id: b
        text: Links that are up can still have the wrong MTU, which only a comparison with the cabling plan reveals.
        explanation: MTU is a configuration setting checked separately; a cabling-plan comparison says nothing about MTU.
      - id: c
        text: The cabling plan defines which FEC mode each link uses, so FEC stays disabled until it is validated.
        explanation: FEC mode is negotiated or configured per link; it does not depend on validating a cabling plan.
    tags: [cabling]
  - id: q4
    type: scenario
    prompt: >
      A link passed BER checks during turn-up (measured idle for 10 seconds). During day two of burn-in it starts
      showing rising FEC-uncorrectable counts and finally flaps. What lesson should change in your process?
    options:
      - id: a
        text: Measure BER after a soak under traffic at operating temperature, and track BER trends during burn-in.
        correct: true
        explanation: Few bits observed on a cool idle link cannot detect low error rates; marginal optics often degrade as they heat up.
      - id: b
        text: Disable FEC during burn-in so that bit errors show up as CRC errors sooner.
        explanation: Disabling FEC on PAM4 links makes them unusable; FEC is required, and the test must reflect the production configuration.
      - id: c
        text: Shorten burn-in to a few hours so that marginal optics are not stressed into failure.
        explanation: Exposing marginal optics during burn-in is exactly the goal; shortening it moves those failures into production.
      - id: d
        text: Accept it; flaps on new optics are normal during burn-in and settle down once the transceivers have aged in.
        explanation: Flaps are a failure criterion; the optic or cable must be replaced and the link retested.
    tags: [ber, burn-in]
  - id: q5
    type: single
    prompt: In nccl-tests output, which number should be compared to your reference for fabric acceptance?
    options:
      - id: a
        text: The busbw at large message sizes (and latency at small sizes, separately).
        correct: true
        explanation: Large-message busbw reflects bandwidth capability normalized for the algorithm; small sizes measure latency.
      - id: b
        text: The "Avg bus bandwidth" line at the end, since it summarizes every message size.
        explanation: It averages over all sizes including latency-bound small messages, so it mixes two different properties.
      - id: c
        text: The algbw at the smallest message size, since it shows the raw link speed.
        explanation: Tiny messages are latency-bound and say nothing about bandwidth.
    tags: [nccl-tests]
  - id: q6
    type: scenario
    prompt: >
      Your pair-test script runs ib_write_bw for one pair at a time across the whole cluster. Every pair passes,
      yet the first full-scale training job sees drops on the RoCE priority. What was missing?
    options:
      - id: a
        text: Concurrent rounds and bisection tests that load shared leaf-spine uplinks simultaneously.
        correct: true
        explanation: One pair at a time never stresses shared links or buffers; many-to-many concurrent load is needed to expose congestion and lossless misconfigurations.
      - id: b
        text: Larger message sizes in the single-pair test, so each pair runs long enough to fill buffers.
        explanation: Message size does not create contention on shared uplinks; a single pair still cannot congest them.
      - id: c
        text: An ib_write_lat run on every pair, since latency outliers reveal congested switch queues.
        explanation: Latency tests barely load the fabric, and run one pair at a time they share nothing, so no queue builds up.
      - id: d
        text: Nothing; some drops on the RoCE priority are expected once production traffic arrives.
        explanation: Drops on the lossless class are a defect.
    tags: [bisection]
  - id: q7
    type: multi
    prompt: Which items belong in written acceptance criteria for a new AI cluster? (Select all that apply.)
    options:
      - id: a
        text: 100 % of links match the cabling plan.
        correct: true
        explanation: Placement errors break rail alignment and must be zero.
      - id: b
        text: Per-pair RDMA bandwidth within a defined tolerance of a reference.
        correct: true
        explanation: Numeric tolerance makes outliers objective defects.
      - id: c
        text: Zero drops on the lossless priority and zero link flaps during the burn-in window.
        correct: true
        explanation: Both are clear, measurable stability criteria.
      - id: d
        text: The cluster feels fast enough to the training team.
        explanation: Subjective criteria lead to disputes and miss slow outliers.
    tags: [acceptance]
  - id: q8
    type: single
    prompt: What is the main purpose of running HPL during burn-in?
    options:
      - id: a
        text: To hold GPUs at sustained maximum power and heat, exposing unstable GPUs, HBM, power or cooling.
        correct: true
        explanation: HPL is a demanding compute stress that triggers infant-mortality hardware failures in GPUs, HBM and the power and cooling path.
      - id: b
        text: To measure all-reduce bus bandwidth across the cluster before nccl-tests are run.
        explanation: That is what nccl-tests measure; HPL is primarily a compute stress.
      - id: c
        text: To verify cabling against the plan by checking which nodes exchange data with which during the run.
        explanation: HPL reports compute performance, not link placement; cabling is validated with LLDP or IB topology discovery.
    tags: [burn-in, hpl]
