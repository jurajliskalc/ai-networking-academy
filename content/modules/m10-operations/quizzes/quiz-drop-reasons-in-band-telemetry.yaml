id: quiz-drop-reasons-in-band-telemetry
title: "Knowledge check: drop reasons, in-band telemetry and histograms"
lesson: drop-reasons-in-band-telemetry
pass_pct: 70
questions:
  - id: q1
    type: scenario
    prompt: "WJH on a Spectrum leaf reports BUFFER tail drops of packets with UDP destination port 4791. The fabric design puts RoCE on lossless priority 3. The dropped packets were classified into priority 0. What is the most likely root cause?"
    options:
      - id: a
        text: "A DSCP marking or trust-mapping error put RoCE traffic into a lossy queue, where tail drops are expected."
        correct: true
        explanation: "RoCE in priority 0 is unprotected by PFC; fix the host marking or the switch trust and DSCP-to-priority map."
      - id: b
        text: "The PFC headroom on priority 3 is too small for the cable length, so pause arrives too late to stop drops."
        explanation: "Headroom on priority 3 would matter if the drops were in priority 3; these packets were classified elsewhere."
      - id: c
        text: "A blackhole route for the destination prefix makes the switch discard the packets at the egress queue."
        explanation: "A missing route would appear as an L3 drop with a blackhole reason, not as a buffer tail drop."
      - id: d
        text: "Normal congestion on a healthy fabric; tail drops of RoCE traffic need no action if ECN is enabled."
        explanation: "RoCE is meant to run lossless here; drops trigger retransmissions and slow collectives."
    tags: [wjh, roce, qos]
  - id: q2
    type: single
    prompt: "Which INT mode leaves data packets unmodified and has switches export metadata for watched flows directly to a collector?"
    options:
      - id: a
        text: "INT-XD (eXport Data), formerly called postcard mode."
        correct: true
        explanation: "In INT-XD, nodes export metadata based on flow watchlists without changing the packets."
      - id: b
        text: "INT-MD (eMbed Data), the classic hop-by-hop mode."
        explanation: "INT-MD writes instructions and metadata into the packet at every hop."
      - id: c
        text: "INT-MX (eMbed instructions), with a sink at the edge."
        explanation: "INT-MX does embed an instruction header in the packet, although metadata goes to the collector."
      - id: d
        text: "IOAM pre-allocated trace mode, defined by RFC 9197."
        explanation: "IOAM trace options write node records into space inside the packet; they are not an INT mode."
    tags: [int]
  - id: q3
    type: scenario
    prompt: "In-band telemetry for one RoCE packet on path L1 -> S2 -> L4 at 400 Gb/s reports hop latency 1.2 us at L1, 30 us at S2 (queue occupancy 1.5 MB, egress utilisation 99%) and 1.3 us at L4. What is the best interpretation?"
    options:
      - id: a
        text: "The S2 downlink towards L4 is the congested hop; 1.5 MB at 50 GB/s explains about 30 us of queueing."
        correct: true
        explanation: "The queue occupancy divided by the drain rate matches the hop latency, and the link runs at line rate: senders converge on L4 through S2."
      - id: b
        text: "The source leaf L1 is congested, because the first hop always dominates the latency of an RDMA path."
        explanation: "L1 shows 1.2 us and a small queue; the data point clearly to S2."
      - id: c
        text: "The destination host is slow to consume data, so L4 is congested and its pause frames back up into S2."
        explanation: "L4's own hop latency is low; if L4 were pausing S2 you would see that in PFC counters, and S2's egress would not run at 99%."
      - id: d
        text: "The telemetry is inconsistent, since 1.5 MB at 400 Gb/s would drain in about 3.75 us, not 30 us."
        explanation: "400 Gb/s is 50 GB/s; 1.5 MB / 50 GB/s = 30 us. The 3.75 us result confuses bits and bytes."
    tags: [int, congestion, calculation]
  - id: q4
    type: single
    prompt: "A Spectrum egress-buffer histogram is configured with bin-min-boundary 960 and histogram-size 12288. Which byte range does bin 9 cover?"
    options:
      - id: a
        text: "13,248 bytes and above."
        correct: true
        explanation: "Max = 960 + 12,288 = 13,248; bins 1-8 are 1,536 bytes wide between 960 and 13,248, and bin 9 is everything above."
      - id: b
        text: "12,288 bytes and above."
        explanation: "This ignores the minimum boundary; the top of bin 8 is the minimum plus the histogram size."
      - id: c
        text: "11,712 to 13,248 bytes."
        explanation: "That is bin 8, the last of the eight equal-width bins."
      - id: d
        text: "0 to 960 bytes."
        explanation: "That is bin 0, below the minimum boundary."
    tags: [histograms, calculation]
  - id: q5
    type: multi
    prompt: "Which statements about NVIDIA WJH on Cumulus Linux are correct according to its documentation? (Select all that apply.)"
    options:
      - id: a
        text: "It groups drops into L1, L2, L3, tunnel, buffer and ACL categories."
        correct: true
        explanation: "These are the documented drop categories."
      - id: b
        text: "Buffer-drop monitoring requires Spectrum-2 or later and uses a SPAN destination."
        correct: true
        explanation: "The documentation lists both constraints."
      - id: c
        text: "The WJH service should be disabled when the NetQ agent on the switch collects WJH data."
        correct: true
        explanation: "The NetQ agent retrieves WJH data directly."
      - id: d
        text: "It reports only drop counts per port and cannot show dropped packet headers."
        explanation: "The packet buffer shows per-packet details (addresses, ports, reason) and can be exported as PCAP."
    tags: [wjh]
  - id: q6
    type: scenario
    prompt: "After a front-end EVPN leaf grew by several hundred tenant prefixes, some destinations are blackholed. BGP shows valid routes for them, and WJH reports L3 blackhole drops. What should you check next?"
    options:
      - id: a
        text: "Hardware table utilisation with cl-resource-query and the ASIC resource view, since full pools leave routes partially installed."
        correct: true
        explanation: "When hardware resource pools fill, routes known to the control plane may not be fully programmed in the ASIC."
      - id: b
        text: "The PFC headroom on the leaf's uplinks, since blackhole drops are a symptom of lossless buffers overflowing."
        explanation: "Buffer overflow appears as buffer drops, not as L3 blackhole drops."
      - id: c
        text: "The histogram bin boundaries on the leaf, because a badly sized histogram can make the ASIC drop routed traffic."
        explanation: "Histograms observe queues; they do not change forwarding."
      - id: d
        text: "The INT sink configuration, since packets carrying INT headers are discarded when no sink strips them."
        explanation: "Nothing in the scenario involves in-band telemetry; the drop reason points at routing or resources."
    tags: [resources, l3, cumulus]
  - id: q7
    type: single
    prompt: "Why do fabrics rarely enable hop-by-hop in-band telemetry (INT-MD) for all traffic?"
    options:
      - id: a
        text: "Each hop appends metadata, adding header bytes per packet and load on the collector."
        correct: true
        explanation: "Overhead grows with the number of hops and fields; watch-lists, sampling or probes keep it manageable."
      - id: b
        text: "INT-MD requires PFC to be disabled on every switch that inserts telemetry headers."
        explanation: "INT has no dependency on PFC being disabled."
      - id: c
        text: "INT-MD only works on InfiniBand fabrics, where the subnet manager collects the records."
        explanation: "INT is defined for packet networks such as Ethernet/IP; it is not an InfiniBand mechanism."
      - id: d
        text: "Telemetry headers are encrypted, so every switch needs a key shared with the collector."
        explanation: "The INT specification does not require encrypting telemetry headers."
    tags: [int, overhead]
