id: quiz-streaming-telemetry-gnmi
title: "Knowledge check: streaming telemetry and gNMI"
lesson: streaming-telemetry-gnmi
pass_pct: 70
questions:
  - id: q1
    type: single
    prompt: Which gNMI subscription choice best fits interface oper-status?
    options:
      - id: a
        text: STREAM with ON_CHANGE, ideally with a heartbeat.
        correct: true
        explanation: Oper status is discrete state; you want the change immediately and nothing in between. A heartbeat guards against silently missed updates.
      - id: b
        text: STREAM with SAMPLE every 10 minutes to limit load.
        explanation: A flap that lasts a few seconds would be missed entirely or reported late.
      - id: c
        text: ONCE subscriptions, re-run by cron every minute.
        explanation: This rebuilds polling with extra session overhead and still misses short events.
    tags: [gnmi]
  - id: q2
    type: scenario
    prompt: >
      Your Grafana panel of switch buffer occupancy (sampled every 10 s) is always near 0 %, yet PFC pause
      counters on the same ports increase by thousands per minute. What is the best explanation and fix?
    options:
      - id: a
        text: Instantaneous samples miss short bursts; export peak-occupancy watermarks or histograms instead.
        correct: true
        explanation: Bursts that fill the buffer for microseconds to milliseconds are almost never caught by a 10 s point sample. A watermark reports the worst moment in each interval.
      - id: b
        text: The pause counters are wrong; with an empty buffer no pause can be sent, so ignore them.
        explanation: Pauses are generated only when ingress buffers cross XOFF; they prove the buffer filled at some point.
      - id: c
        text: The switch reports occupancy incorrectly; open a hardware case and replace it.
        explanation: Nothing indicates a hardware fault; this is a sampling artefact.
      - id: d
        text: Poll buffer occupancy with SNMP every 5 minutes instead, which averages out the noise.
        explanation: Longer intervals make the averaging problem worse; the bursts disappear completely.
    tags: [buffers, sampling]
  - id: q3
    type: scenario
    prompt: >
      During an outage the fabric dashboard showed all ports green. Afterwards you find the gNMI collector lost
      its sessions to half the leaves two hours earlier. What should you add?
    options:
      - id: a
        text: Alerts on collector and target health (target up, stale series, subscription resets) plus gNMI heartbeats.
        correct: true
        explanation: A silent pipeline looks identical to a quiet fabric. Monitoring the monitoring is mandatory.
      - id: b
        text: A longer sample interval, so the collector has less load and stops dropping sessions.
        explanation: It may reduce load, but it does not detect lost sessions, so the next loss would be just as silent.
      - id: c
        text: More per-leaf dashboards, so that engineers notice when a leaf's graphs look flat.
        explanation: Missing data and a quiet port look the same on a dashboard, and nothing alerts anyone; dashboards built on missing data still show nothing.
      - id: d
        text: ON_CHANGE subscriptions for all counters, so updates arrive the moment anything changes.
        explanation: Counters change continuously; ON_CHANGE is for state and does not solve session loss detection.
    tags: [pipeline, alerting]
  - id: q4
    type: single
    prompt: In gNMI notifications, why should rate calculations use the device timestamp?
    options:
      - id: a
        text: Collector receive time shifts when the collector or network is backlogged, creating false spikes and dips.
        correct: true
        explanation: The device timestamp marks when the value was read, so deltas divided by device time are accurate.
      - id: b
        text: gNMI notifications carry no timestamp at all, so the collector has to assign one when each update arrives.
        explanation: Each Notification carries a timestamp in nanoseconds since the epoch.
      - id: c
        text: Device timestamps are SNMP TimeTicks, the format Prometheus requires for counter rates.
        explanation: gNMI uses nanoseconds since the epoch; TimeTicks are an SNMP concept, and Prometheus does not require them.
    tags: [gnmi]
  - id: q5
    type: scenario
    prompt: >
      You plan to stream all 300+ ethtool -S counters from 8,000 NIC ports, labelled with job_id, every second.
      What is the main risk?
    options:
      - id: a
        text: Cardinality and ingest volume explode and overwhelm the TSDB; curate counters and keep job_id off raw series.
        correct: true
        explanation: Millions of series at 1 s, multiplied by a churning job_id label, is a classic way to take down Prometheus.
      - id: b
        text: The NICs will pause or drop RoCE traffic while the driver reads hundreds of counters each second.
        explanation: Reading counters does not drop or pause data-plane traffic; the cost is on the monitoring side.
      - id: c
        text: gNMI cannot carry 64-bit integer counters, so the values will wrap and produce wrong rates.
        explanation: gNMI typed values include 64-bit unsigned and signed integers as well as float, string and other types.
      - id: d
        text: None worth planning for; storage is cheap, and more labelled data is always better to have during an incident.
        explanation: Uncurated high-cardinality data costs money and reliability and slows queries during incidents.
    tags: [cardinality]
  - id: q6
    type: scenario
    prompt: >
      In a symmetric rail-optimized fabric, normal PFC pause rates vary a lot between workloads. Which alert
      design is most robust?
    options:
      - id: a
        text: Alert when a port's pause rate exceeds a multiple of the median of comparable ports, sustained for minutes.
        correct: true
        explanation: Peer-relative outlier detection adapts to workload, and symmetry makes outliers meaningful.
      - id: b
        text: Alert when the cumulative pause counter on any port exceeds a fixed value such as 1,000,000.
        explanation: Cumulative values reflect uptime, not current behaviour.
      - id: c
        text: Alert on any pause frame at all, since a lossless fabric should never need to pause.
        explanation: Some pauses are normal under incast; this alert would fire constantly.
      - id: d
        text: Disable pause alerting and rely on job failures, since pauses on their own never lose data.
        explanation: Pause storms slow jobs long before anything fails; you would miss the most common harm.
    tags: [alerting, pfc]
  - id: q7
    type: multi
    prompt: Which statements about OpenConfig and gNMI are correct? (Select all that apply.)
    options:
      - id: a
        text: The Capabilities RPC lists the models and encodings a target supports.
        correct: true
        explanation: Start with capabilities to see what you can subscribe to.
      - id: b
        text: Coverage of PFC, ECN and buffer data often requires vendor-native models.
        correct: true
        explanation: OpenConfig coverage of lossless Ethernet details varies by NOS and release.
      - id: c
        text: gNMI always runs on TCP port 161.
        explanation: Port 161 is SNMP. gNMI ports vary by NOS (57400 and 9339 are common).
      - id: d
        text: gNMI runs over gRPC, normally protected with TLS.
        correct: true
        explanation: gNMI is a gRPC service over HTTP/2, typically with TLS or mTLS.
    tags: [openconfig, gnmi]
  - id: q8
    type: single
    prompt: Where does high-frequency (sub-second) switch telemetry fit best?
    options:
      - id: a
        text: As a targeted diagnostic on a few ports during an investigation, such as microbursts in a collective.
        correct: true
        explanation: Its data volume is orders of magnitude higher than normal sampling, so it is a microscope, not a fleet-wide default.
      - id: b
        text: As the fleet-wide default for every counter on every port, replacing normal sampling.
        explanation: The volume and cost would be enormous for little added value.
      - id: c
        text: Only for optics temperature and power, whose readings change fastest on hot links.
        explanation: Optics temperature and power move slowly; 60 s sampling is enough.
    tags: [high-frequency]
