id: quiz-bgp-in-the-data-center
title: "Knowledge check: BGP in the data center"
lesson: bgp-in-the-data-center
pass_pct: 70
questions:
  - id: q1
    type: single
    prompt: In an RFC 7938-style two-tier fabric, how are ASNs typically assigned?
    options:
      - id: a
        text: All spines share one ASN; every leaf has its own unique ASN.
        correct: true
        explanation: Shared spine ASN prevents path hunting; unique leaf ASNs let leaves accept each other's routes.
      - id: b
        text: Every switch in the fabric shares one ASN and runs iBGP with route reflectors.
        explanation: RFC 7938 recommends eBGP on every link, without iBGP or route reflectors.
      - id: c
        text: Every spine has a unique ASN; all leaves share one ASN.
        explanation: Unique spine ASNs enable path hunting and shared leaf ASNs cause loop-prevention drops.
      - id: d
        text: ASNs are not used because BGP runs only inside one AS.
        explanation: eBGP sessions require different ASNs on each side.
    tags: [bgp, asn]
  - id: q2
    type: single
    prompt: Why does a shared spine ASN eliminate path hunting after a leaf prefix is withdrawn?
    options:
      - id: a
        text: A backup path learned via another spine already carries the spine ASN, so every spine drops it in the AS_PATH loop check.
        correct: true
        explanation: Stale paths cannot bounce between spines via leaves, so the withdrawal is final immediately.
      - id: b
        text: Spines sharing an ASN form an iBGP full mesh among themselves and flush the stale path together as soon as one of them sees the withdrawal.
        explanation: Spines do not peer with or connect to each other in a leaf-spine fabric; there is no spine-to-spine iBGP mesh.
      - id: c
        text: The shared ASN makes leaves suppress all BGP updates while a failure is in progress, so no stale alternative is advertised upward.
        explanation: Updates are still sent; paths that would loop through the spine ASN are simply rejected on receipt.
    tags: [bgp, convergence]
  - id: q3
    type: scenario
    prompt: "A leaf has eight uplinks, all with established BGP sessions. show ip bgp for a remote prefix lists eight paths, but show ip route installs only four next hops. What is the most likely cause?"
    options:
      - id: a
        text: maximum-paths is set to 4 for that address family.
        correct: true
        explanation: BGP knows all eight paths but installs only as many as the multipath width allows.
      - id: b
        text: Four of the eight spines have failed and are no longer reachable.
        explanation: All sessions are established and BGP sees eight paths, so all spines are up.
      - id: c
        text: BFD is disabled, so only four next hops count as verified.
        explanation: BFD affects failure detection speed, not how many ECMP paths are installed.
      - id: d
        text: The MTU is too small on four of the eight uplinks.
        explanation: MTU mismatch typically affects session establishment or data, not the number of installed paths when sessions are up.
    tags: [ecmp, bgp]
  - id: q4
    type: scenario
    prompt: "A server is dual-homed to leaf A (AS 65101) and leaf B (AS 65102), and advertises its prefix to both. A remote leaf sees two paths of equal length, '65000 65101' and '65000 65102', but installs only one. Which setting is missing?"
    options:
      - id: a
        text: AS-path multipath-relax (in FRR, bgp bestpath as-path multipath-relax)
        correct: true
        explanation: By default multipath requires identical AS paths; relax allows equal-length paths with different ASNs.
      - id: b
        text: allowas-in on the remote leaf, so it accepts paths from both leaf ASNs
        explanation: allowas-in permits routes containing the local ASN. Both paths are already accepted; the problem is that they are not combined.
      - id: c
        text: next-hop-self on leaf A and leaf B toward the spines
        explanation: Next-hop handling does not decide multipath eligibility in eBGP.
      - id: d
        text: A route reflector on the spines to merge the two paths
        explanation: RFC 7938 fabrics do not use route reflectors, and a reflector would not fix multipath selection.
    tags: [bgp, multipath]
  - id: q5
    type: multi
    prompt: Which statements about BGP unnumbered are correct? Select all that apply.
    options:
      - id: a
        text: Sessions use the IPv6 link-local addresses of the fabric interfaces.
        correct: true
        explanation: Every IPv6-enabled interface has a link-local address without any configuration.
      - id: b
        text: Neighbours discover each other's link-local address via IPv6 Router Advertisements.
        correct: true
        explanation: That is why RA must not be suppressed on unnumbered fabric links.
      - id: c
        text: IPv4 prefixes are advertised with an IPv6 next hop using the extended next hop capability (RFC 5549, now RFC 8950).
        correct: true
        explanation: This lets IPv4 routing work without IPv4 addresses on links.
      - id: d
        text: It requires a /31 IPv4 address on every link.
        explanation: Removing per-link IPv4 addressing is the whole point.
    tags: [bgp-unnumbered]
  - id: q6
    type: scenario
    prompt: "A spine's line card stops forwarding but its links stay physically up. Fabric BGP uses 60 s keepalive and 180 s hold timers, and BFD is not configured. What will leaves experience, and what is the fix?"
    options:
      - id: a
        text: Flows hashed to that spine are blackholed for up to ~180 s until the hold timer expires; enable BFD and shorten timers.
        correct: true
        explanation: With the link up, only keepalive loss or BFD reveals the failure, so detection takes up to the hold time.
      - id: b
        text: Nothing visible; leaf ECMP notices the dead next hop from the missing return traffic and rehashes the flows within milliseconds.
        explanation: ECMP only uses next hops installed by routing; it has no data-plane health check of its own.
      - id: c
        text: Leaves withdraw that spine at once, because the line-card failure is signalled to every attached port as link-down.
        explanation: The links stay physically up, so there is no link-down event to react to.
      - id: d
        text: All traffic in the fabric stops until the spine reboots, because every leaf loses its routes at the same moment.
        explanation: Only traffic hashed to the failed spine is affected; the other spines keep forwarding.
    tags: [bfd, timers]
  - id: q7
    type: single
    prompt: Which ASN range is reserved for private use with 32-bit ASNs (RFC 6996) and is preferred for large fabrics?
    options:
      - id: a
        text: 4200000000 to 4294967294
        correct: true
        explanation: It provides about 95 million private ASNs, enough for unique leaf ASNs at any scale.
      - id: b
        text: 64512 to 65534
        explanation: That is the 16-bit private range, only 1,023 ASNs.
      - id: c
        text: 1 to 64511
        explanation: These are public ASNs assigned by registries.
      - id: d
        text: 131072 to 4199999999
        explanation: This is public 32-bit ASN space allocated by the regional registries, not the private-use block.
    tags: [asn]
