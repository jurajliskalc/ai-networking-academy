id: quiz-nccl-architecture
title: "Knowledge check: NCCL architecture"
lesson: nccl-architecture
pass_pct: 70
questions:
  - id: q1
    type: single
    prompt: "What network traffic does NCCL's bootstrap phase use?"
    options:
      - id: a
        text: "TCP sockets over an IP interface (chosen with NCCL_SOCKET_IFNAME) to exchange addresses and metadata."
        correct: true
        explanation: "Bootstrap is control traffic over sockets; the data path is set up afterwards."
      - id: b
        text: "RDMA writes over the back-end fabric, issued as soon as the IB verbs transport has loaded."
        explanation: "RDMA connections are created after bootstrap, using the addresses and metadata exchanged during it over sockets."
      - id: c
        text: "NVLink messages between nodes, relayed through NVSwitch before any NIC is initialized."
        explanation: "NVLink does not connect separate nodes in typical clusters (outside NVLink-domain systems), and bootstrap uses sockets."
      - id: d
        text: "SHARP aggregation trees on the InfiniBand switches, which also distribute the communicator's unique ID to every rank."
        explanation: "SHARP is for in-network reduction, not bootstrap; the unique ID is passed out of band by the application, and bootstrap runs over sockets."
    tags: [bootstrap]
  - id: q2
    type: single
    prompt: "Why does NCCL create multiple channels for a collective?"
    options:
      - id: a
        text: "To run several rings or trees in parallel over different links and NICs, so all available bandwidth is used."
        correct: true
        explanation: "One ring would use one NIC per node per direction; channels spread the work."
      - id: b
        text: "To provide backup paths, so the traffic of a failed NIC can move to another channel's NIC."
        explanation: "Channels exist for parallelism over multiple paths; they are not a failover mechanism."
      - id: c
        text: "To isolate the traffic of different tenants or jobs sharing a node onto their own queue pairs, NICs and switch queues."
        explanation: "Channels belong to one communicator and are not an isolation mechanism."
      - id: d
        text: "Because a GPU can send to only one peer per channel, so each ring neighbour needs its own channel."
        explanation: "In a ring each rank already has a single send peer per channel; channels exist to use multiple links and NICs concurrently, not because of a peer limit."
    tags: [channels]
  - id: q3
    type: scenario
    prompt: "NCCL INFO output on a multi-node job shows 'Using network Socket' and inter-node hops 'via NET/Socket'. The cluster has working ConnectX NICs. What is the most likely cause?"
    options:
      - id: a
        text: "The IB verbs transport failed to initialize, e.g. RDMA devices are not visible in the container or NCCL_IB_HCA matched no device."
        correct: true
        explanation: "NCCL falls back to TCP sockets when the IB transport cannot be used, with a large performance loss."
      - id: b
        text: "NCCL always uses TCP sockets between nodes; its IB verbs transport is only used for peers inside a node."
        explanation: "With RDMA NICs NCCL normally uses its IB verbs transport (NET/IB) between nodes; inside a node it uses P2P or SHM."
      - id: c
        text: "The job opened more channels than the NICs support, so NCCL ran out of RDMA queue pairs on the ConnectX NICs and fell back to sockets."
        explanation: "Channel count does not change the transport selection; the socket fallback means the IB transport could not be used at all."
      - id: d
        text: "PXN is enabled, which routes inter-node data through a peer GPU over a socket proxy."
        explanation: "PXN moves data over NVLink to a peer GPU whose NIC sends it; it changes which NIC sends, not whether RDMA is used."
    tags: [transports, troubleshooting]
  - id: q4
    type: single
    prompt: "What is the role of the NCCL proxy thread?"
    options:
      - id: a
        text: "A CPU thread that posts network operations to the NIC and polls completions on behalf of the GPU kernels."
        correct: true
        explanation: "GPU kernels fill buffers and set flags; the proxy drives the RDMA NIC."
      - id: b
        text: "A thread that compresses gradients to a smaller format before sending, to cut bytes on the wire."
        explanation: "NCCL does not compress data; the proxy drives the NIC."
      - id: c
        text: "A helper thread that fetches topology XML files from a central server at communicator init."
        explanation: "Topology is detected locally from sysfs and NVML (optionally overridden with a local file via NCCL_TOPO_FILE); nothing is downloaded."
      - id: d
        text: "A dedicated GPU warp inside each NCCL kernel that performs the reductions while the other warps move data over NVLink."
        explanation: "Reductions run in GPU thread blocks; the proxy runs on the CPU."
    tags: [proxy]
  - id: q5
    type: scenario
    prompt: "In a rail-optimized cluster, GPU 2 on node A sends to GPU 5 on node B. With PXN enabled, what path does NCCL typically use?"
    options:
      - id: a
        text: "NVLink from GPU 2 to GPU 5 on node A, then out of GPU 5's NIC on rail 5 to node B, staying on one rail."
        correct: true
        explanation: "PXN moves data over NVLink to the GPU sharing the destination's rail, avoiding spine crossings."
      - id: b
        text: "Out of GPU 2's own NIC on rail 2 to the rail-2 leaf, then up across the spine layer to node B's rail-5 leaf."
        explanation: "That is the non-PXN path that PXN avoids."
      - id: c
        text: "Through host shared memory to GPU 5's NIC, then over a TCP socket to node B."
        explanation: "PXN uses NVLink and RDMA, not SHM and sockets."
      - id: d
        text: "Via a SHARP-capable switch that forwards and reduces the data on its way to node B."
        explanation: "PXN is about routing point-to-point data, not in-network reduction."
    tags: [pxn, rail]
  - id: q6
    type: single
    prompt: "Which statement about NCCL's protocols is correct?"
    options:
      - id: a
        text: "LL: 4 B data plus a 4 B flag (~50 % efficient, lowest latency); LL128: 120 of 128 B are data; Simple: big chunks with fences, full bandwidth."
        correct: true
        explanation: "The protocols trade payload efficiency against synchronization latency."
      - id: b
        text: "Simple has the lowest latency because it carries no inline flags at all, while LL gives up latency in exchange for higher bandwidth efficiency."
        explanation: "Simple uses separate flags after memory fences, which costs latency per step; LL is the low-latency protocol and gives up bandwidth efficiency."
      - id: c
        text: "LL128 is used on every platform, because 128-byte stores arrive atomically on all GPUs and interconnects, so it always beats LL and Simple."
        explanation: "LL128 depends on hardware ordering guarantees that not every platform provides, so it is enabled only on supported platforms."
      - id: d
        text: "The protocol is chosen once per communicator at init and cannot vary with message size or collective."
        explanation: "NCCL picks algorithm and protocol per collective and size."
    tags: [protocols]
  - id: q7
    type: multi
    prompt: "Which of these are NCCL transports or transport-level mechanisms? (Select all that apply.)"
    options:
      - id: a
        text: "P2P over NVLink or PCIe between GPUs in the same node."
        correct: true
        explanation: "P2P is the intra-node transport when peer access is available."
      - id: b
        text: "SHM staging through host shared memory."
        correct: true
        explanation: "Used when P2P is unavailable or disabled."
      - id: c
        text: "NET using the built-in IB verbs implementation or an external plugin."
        correct: true
        explanation: "NET carries inter-node traffic; plugins (e.g. aws-ofi-nccl) implement the same interface."
      - id: d
        text: "VXLAN tunnels created by NCCL between GPUs."
        explanation: "NCCL does not create overlay tunnels."
    tags: [transports]
