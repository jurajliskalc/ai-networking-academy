id: quiz-pfc-priority-flow-control
title: "Knowledge check: Priority Flow Control"
lesson: pfc-priority-flow-control
pass_pct: 70
questions:
  - id: q1
    type: single
    prompt: "Which field of a PFC frame tells the receiver how long to pause a given priority?"
    options:
      - id: a
        text: "One of the eight per-priority time fields, in quanta of 512 bit times"
        correct: true
        explanation: "Each priority has its own 16-bit timer. The class-enable vector says which timers are valid."
      - id: b
        text: "The DSCP value of the paused traffic, which maps to a pause duration"
        explanation: "PFC is a MAC control frame. It has no IP header, and DSCP does not encode a pause duration."
      - id: c
        text: "The MAC control opcode, which encodes one of several fixed pause lengths"
        explanation: "The opcode (0x0101) only identifies the frame as PFC. It carries no duration."
      - id: d
        text: "The class-enable vector, where each set bit adds one quantum of pause time"
        explanation: "The vector only selects which priorities the frame applies to. The durations are in the per-priority timer fields."
    tags: [pfc, frame]
  - id: q2
    type: single
    prompt: "A PFC frame pauses priority 3 with the maximum timer value (65 535 quanta) on a 400 Gb/s link. Roughly how long is that pause if no XON follows?"
    options:
      - id: a
        text: "About 84 microseconds"
        correct: true
        explanation: "512 bits at 400 Gb/s = 1.28 ns. 65 535 × 1.28 ns ≈ 84 µs. That is why switches refresh pauses while congested."
      - id: b
        text: "About 335 microseconds"
        explanation: "That is the figure for 100 Gb/s, where a quantum is 5.12 ns."
      - id: c
        text: "About 65 milliseconds"
        explanation: "That would require a quantum of 1 µs. Quanta are 512 bit times, so they get shorter as speed rises."
      - id: d
        text: "Indefinitely, until an XON frame arrives"
        explanation: "The timer expires on its own. Long pauses happen because the congested device keeps sending refresh PFC frames."
    tags: [pfc, quanta]
  - id: q3
    type: scenario
    prompt: "During an all-to-all job, a leaf shows a fast-rising Rx PFC count for priority 3 on the downlink to host H12, and H12's ethtool -S shows tx_prio3_pause climbing. Other hosts show only rx_prio3_pause. Where should you look first?"
    options:
      - id: a
        text: "H12's receive path: PCIe, NUMA placement, a stalled process or NIC firmware"
        correct: true
        explanation: "H12 is sending pauses to the switch, so its NIC receive buffer is filling. The bottleneck is inside that host."
      - id: b
        text: "The leaf's uplinks to the spines, which are oversubscribed during all-to-all phases"
        explanation: "Uplink congestion would make the leaf send pauses, not receive them from a host."
      - id: c
        text: "ECN thresholds on the spine, which mark too late and leave PFC to absorb the incast"
        explanation: "ECN tuning affects how the network signals congestion. It does not explain a host generating pauses toward the leaf."
      - id: d
        text: "The PFC configuration of the other hosts, which are not honouring the leaf's pauses"
        explanation: "The other hosts behave normally (receiving occasional pauses). The anomaly is the host that sends them."
    tags: [pfc, troubleshooting]
  - id: q4
    type: single
    prompt: "What triggers a switch to send a PFC frame for priority 3 out of port X?"
    options:
      - id: a
        text: "The ingress priority group for priority 3 on port X crossing its XOFF threshold"
        correct: true
        explanation: "PFC is driven by ingress accounting: the switch pauses the neighbour that is filling its buffer."
      - id: b
        text: "Egress queue 3 on port X overflowing and dropping a packet of the lossless class"
        explanation: "PFC is meant to prevent drops in the lossless class. It is triggered by ingress occupancy before any drop."
      - id: c
        text: "Receiving a CE-marked packet for priority 3 on port X from the neighbour"
        explanation: "ECN marks are end-to-end signals for the receiver NIC. They do not trigger PFC."
      - id: d
        text: "Any priority on port X exceeding its configured ETS bandwidth share for a while"
        explanation: "ETS shares govern scheduling, not pausing, and they are minimums rather than limits."
    tags: [pfc, xoff]
  - id: q5
    type: scenario
    prompt: "RoCE throughput collapses under incast. Hosts show rising out_of_sequence and packet_seq_err counters, and neither hosts nor switches show any PFC frames on any priority. Hosts are configured with PFC on priority 3. What is the most likely cause?"
    options:
      - id: a
        text: "The switches do not have PFC enabled on the priority RoCE is classified into, so they drop."
        correct: true
        explanation: "Sequence errors mean loss. No PFC anywhere means the lossless class does not exist on the switches for this traffic, so they drop instead of pausing."
      - id: b
        text: "PFC is working, and the sequence errors come from ECN marks that the NICs treat as loss."
        explanation: "ECN marks do not cause sequence errors; loss does. And working PFC would show counters under incast."
      - id: c
        text: "The PFC timers on the hosts are too short, so pauses expire before the switch buffers drain."
        explanation: "With no PFC frames at all, timer values cannot matter."
      - id: d
        text: "The UDP source port entropy is too low, so incast flows collide on one uplink and overflow it."
        explanation: "Low entropy can cause hot spots, but it does not explain the absence of any PFC under incast on a class that should be lossless."
    tags: [pfc, misconfiguration]
  - id: q6
    type: multi
    prompt: "Which statements correctly compare PFC with InfiniBand credit-based flow control? (Select all that apply.)"
    options:
      - id: a
        text: "IB senders transmit only when they hold credit, while PFC senders transmit until they are paused."
        correct: true
        explanation: "Credits are proactive, and PFC is reactive."
      - id: b
        text: "Both need roughly a round trip of buffering per lossless class per port."
        correct: true
        explanation: "Credits must cover the round trip to keep the link busy, and PFC headroom must cover it to avoid drops."
      - id: c
        text: "PFC cannot cause head-of-line blocking because it operates per priority."
        explanation: "PFC pauses every flow in the priority on that link, so victim flows are blocked."
      - id: d
        text: "Only PFC has deadlock risks, because credit loops are impossible."
        explanation: "IB can also deadlock with cyclic credit dependencies. Routing and VL design avoid it."
    tags: [pfc, infiniband]
  - id: q7
    type: single
    prompt: "Why is 802.3x link-level PAUSE normally disabled on RoCE fabric ports?"
    options:
      - id: a
        text: "It stops all traffic classes on the link, so congestion in one class stalls unrelated traffic."
        correct: true
        explanation: "802.3x has one timer for the whole link. PFC pauses only the affected priority."
      - id: b
        text: "802.3x PAUSE frames are forwarded by switches, so they can loop around a multi-tier fabric."
        explanation: "PAUSE frames are link-local MAC control frames and are never forwarded."
      - id: c
        text: "802.3x uses a different destination MAC address, which RoCE-capable switch ports cannot receive."
        explanation: "Both 802.3x and PFC use 01-80-C2-00-00-01."
      - id: d
        text: "802.3x cannot be used on links faster than 10 Gb/s, which rules it out on AI fabrics."
        explanation: "There is no such speed limit. It is disabled because of its coarse scope."
    tags: [pause, 802.3x]
  - id: q8
    type: scenario
    prompt: "On a ConnectX host, PFC was enabled on priority 3 and verified. Later a hardening script ran 'ethtool -A ens1f0np0 rx on tx on' and exited with code 0. Under the next incast the host shows no prio-3 pause counters at all and RoCE retransmissions rise. What happened?"
    options:
      - id: a
        text: "Enabling global pause on mlx5 silently cleared PFC on every priority, so priority 3 is lossy again."
        correct: true
        explanation: "On mlx5, global pause and PFC are mutually exclusive: enabling PFC turns global pause off, and turning global pause back on clears PFC without any warning. Re-check the PFC vector after any ethtool -A."
      - id: b
        text: "Global pause and PFC now run together, and the per-priority counters are folded into the global ones."
        explanation: "They do not run together on mlx5. The per-priority pause counters disappear because PFC is no longer enabled on priority 3."
      - id: c
        text: "The switch detected the 802.3x frames and disabled PFC on its port, so the host stopped receiving pauses."
        explanation: "The change happened on the host. The NIC itself dropped its PFC configuration when global pause was enabled."
      - id: d
        text: "ethtool -A only affects the kernel's software queues, so the NIC's PFC state is unchanged and correct."
        explanation: "ethtool -A configures the NIC's MAC pause settings, and on mlx5 that overrides the PFC configuration."
    tags: [pfc, pause, 802.3x, mlx5]
