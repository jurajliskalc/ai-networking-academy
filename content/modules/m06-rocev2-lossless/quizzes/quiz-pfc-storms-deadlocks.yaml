id: quiz-pfc-storms-deadlocks
title: "Knowledge check: PFC storms, deadlocks and lossy RoCE"
lesson: pfc-storms-deadlocks
pass_pct: 70
questions:
  - id: q1
    type: scenario
    prompt: "Throughput collapses across three racks. Spine ports show continuous Tx and Rx PFC on priority 3. On Leaf 4, the downlink to host H31 shows Rx PFC rising at a constant high rate, and H31's ethtool -S shows tx_prio3_pause and tx_pause_storm_warning_events increasing. The other hosts show only rx_prio3_pause. What is happening?"
    options:
      - id: a
        text: "A PFC storm rooted at H31's NIC, with back-pressure spreading through Leaf 4 and the spines to victim hosts"
        correct: true
        explanation: "H31 sends pauses without receiving them, which makes it the root. Everyone else is only relaying or receiving back-pressure."
      - id: b
        text: "A PFC deadlock between the spines"
        explanation: "A deadlock has no root device sending pauses. Here there is a clear root."
      - id: c
        text: "Normal incast congestion that DCQCN will resolve"
        explanation: "Continuous pauses from one host, plus storm warning counters, are not normal congestion."
      - id: d
        text: "A spine hardware fault, because the spine shows the most PFC"
        explanation: "Spines are victims here. Follow pauses to the device that sends them without receiving any."
    tags: [pfc-storm, troubleshooting]
  - id: q2
    type: single
    prompt: "What distinguishes a PFC deadlock from a PFC storm?"
    options:
      - id: a
        text: "A deadlock is a cyclic buffer dependency with no root sender, and it persists even when all traffic sources stop."
        correct: true
        explanation: "Each buffer in the cycle waits on the next, so nothing drains without intervention."
      - id: b
        text: "A deadlock only affects lossy traffic."
        explanation: "Deadlock requires lossless back-pressure. Lossy queues drop instead."
      - id: c
        text: "A deadlock clears when the PFC timers expire."
        explanation: "Switches keep refreshing pauses while buffers stay full, so timer expiry does not help."
      - id: d
        text: "A deadlock is caused by a single faulty NIC."
        explanation: "That describes the root of a storm."
    tags: [deadlock]
  - id: q3
    type: multi
    prompt: "Which events can introduce a cyclic buffer dependency into a leaf-spine fabric that normally uses up-down routing? (Select all that apply.)"
    options:
      - id: a
        text: "A link failure that causes traffic to bounce down to a leaf and back up to another spine"
        correct: true
        explanation: "Valley (down-up) paths break the up-down property that keeps Clos cycle-free."
      - id: b
        text: "A transient routing loop during convergence"
        correct: true
        explanation: "A loop is a cycle by definition, and lossless traffic can lock it into a deadlock."
      - id: c
        text: "Flooding of lossless unicast traffic when a MAC entry has expired but the ARP entry is still valid"
        correct: true
        explanation: "Flooding sends packets on paths, including back upward, that routing would never use."
      - id: d
        text: "Enabling ECN marking on the spine queues"
        explanation: "ECN reduces queue depth. It cannot create cycles in the paths."
    tags: [deadlock, cbd]
  - id: q4
    type: single
    prompt: "A switch PFC watchdog configured with the drop action detects a stormed queue. What does it do?"
    options:
      - id: a
        text: "It discards packets queued for and arriving into that queue until the pause condition has cleared for the restoration time."
        correct: true
        explanation: "Sacrificing traffic to a stalled destination frees buffers upstream and collapses the congestion tree."
      - id: b
        text: "It shuts down the physical port permanently."
        explanation: "The watchdog acts per queue and restores automatically. Shutting the port is a manual choice."
      - id: c
        text: "It sends XON frames to the host."
        explanation: "The switch cannot override a host's pauses with XON. The watchdog changes how the switch handles the queue."
      - id: d
        text: "It changes the DSCP of the affected traffic to a lossy class."
        explanation: "Watchdogs do not remark traffic."
    tags: [pfc-watchdog]
  - id: q5
    type: scenario
    prompt: "SONiC pfcwd show stats shows STORM DETECTED/RESTORED climbing to 40/40 over a day on one host-facing queue, and job throughput dips periodically. What is the right response?"
    options:
      - id: a
        text: "Treat it as a host incident: drain the node and investigate its NIC, PCIe, firmware and OS for periodic stalls."
        correct: true
        explanation: "Repeated detect and restore cycles mean the host keeps stalling and recovering. The watchdog is containing a real fault."
      - id: b
        text: "Disable the watchdog on that port to stop the drops."
        explanation: "That removes the protection, and the next stall becomes a fabric-wide storm."
      - id: c
        text: "Reduce the detection time to the minimum."
        explanation: "Shorter detection may drop during legitimate congestion and does not fix the faulty host."
      - id: d
        text: "Increase PFC headroom on the port."
        explanation: "Headroom has nothing to do with a host that stops draining its buffer."
    tags: [pfc-watchdog, operations]
  - id: q6
    type: single
    prompt: "What is the main prerequisite for running RoCE in lossy (resilient) mode, with ECN but no PFC?"
    options:
      - id: a
        text: "NICs with efficient loss recovery (for example selective retransmission) and effective congestion control, validated for lossy operation"
        correct: true
        explanation: "Without PFC some drops occur. Go-back-N recovery makes them costly, so the NIC must handle loss well."
      - id: b
        text: "A larger PFC headroom reservation"
        explanation: "Lossy mode does not use PFC, so it does not need headroom."
      - id: c
        text: "Trusting PCP instead of DSCP"
        explanation: "The trust mode is independent of whether the class is lossless or lossy."
      - id: d
        text: "Running RoCEv1 instead of RoCEv2"
        explanation: "RoCEv1 is not routable and is unrelated to lossy operation."
    tags: [lossy-roce]
  - id: q7
    type: single
    prompt: "Which NIC-side mechanism protects the fabric from a host whose receive path has stalled?"
    options:
      - id: a
        text: "Pause-storm prevention: the NIC stops sending pauses after it has paused continuously for a configured timeout."
        correct: true
        explanation: "On mlx5 this is reflected in the tx_pause_storm_warning_events and tx_pause_storm_error_events counters, and the timeout is an ethtool tunable."
      - id: b
        text: "DCQCN rate reduction on the stalled host"
        explanation: "DCQCN controls the host's sending rate. It does not stop the pauses its receive buffer generates."
      - id: c
        text: "Global 802.3x pause"
        explanation: "Link pause would make the problem worse by stopping all classes."
      - id: d
        text: "Increasing the GID table size"
        explanation: "GIDs are about addressing, not flow control."
    tags: [pfc-storm, nic]
