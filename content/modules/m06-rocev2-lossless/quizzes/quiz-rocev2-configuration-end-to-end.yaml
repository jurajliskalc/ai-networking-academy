id: quiz-rocev2-configuration-end-to-end
title: "Knowledge check: RoCEv2 end-to-end configuration"
lesson: rocev2-configuration-end-to-end
pass_pct: 70
questions:
  - id: q1
    type: single
    prompt: "What does mlnx_qos -i ens1f0np0 --pfc 0,0,0,1,0,0,0,0 configure?"
    options:
      - id: a
        text: "PFC enabled on priority 3 only, on that interface"
        correct: true
        explanation: "The list is per priority, 0 to 7. Only the fourth entry (priority 3) is enabled."
      - id: b
        text: "PFC enabled on traffic class 4 (the list is 1-based)"
        explanation: "The vector is indexed by priority starting at 0, and it configures priorities rather than TCs."
      - id: c
        text: "Priority 3 mapped to DSCP 26 on that interface"
        explanation: "DSCP mapping uses the trust and dscp2prio settings, not the --pfc vector."
      - id: d
        text: "ECN marking enabled for priority 3 traffic only"
        explanation: "ECN/DCQCN is configured separately, for example through the NIC congestion-control settings."
    tags: [mlnx_qos, pfc]
  - id: q2
    type: scenario
    prompt: "A cluster performed perfectly at acceptance. After a maintenance window with reboots, about 10 % of nodes show RoCE bytes in tx_prio0_bytes and no PFC configuration in mlnx_qos output. Nothing else changed. What is the most likely cause?"
    options:
      - id: a
        text: "The host QoS settings were applied at runtime only and were not made persistent across reboots."
        correct: true
        explanation: "mlnx_qos, sysfs and ethtool settings are lost at reboot unless a boot-time mechanism reapplies them."
      - id: b
        text: "The switches lost their RoCE QoS profile during the maintenance window and reverted to defaults."
        explanation: "Host-side counters and mlnx_qos output show the hosts themselves are unconfigured, whatever the switches do."
      - id: c
        text: "NCCL_IB_TC was removed from the job template, so NCCL traffic fell back to priority 0."
        explanation: "That could move NCCL traffic to priority 0, but it would not explain mlnx_qos showing no PFC configuration."
      - id: d
        text: "The NIC firmware resets its QoS tables on a schedule, and the window coincided with that reset."
        explanation: "There is no such scheduled reset. The reboot is the trigger, and runtime-only settings did not survive it."
    tags: [persistence, operations]
  - id: q3
    type: single
    prompt: "On Cumulus Linux with NVUE, which command sequence enables the NVIDIA RoCE QoS profile and displays the result?"
    options:
      - id: a
        text: "nv set qos roce, then nv config apply, then nv show qos roce"
        correct: true
        explanation: "NVUE stages changes with nv set, applies them with nv config apply, and shows state with nv show. Check your release's reference for options such as mode lossy."
      - id: b
        text: "mlnx_qos -i swp1 --trust dscp, then nv show qos roce"
        explanation: "mlnx_qos is a host NIC tool, not the switch configuration interface."
      - id: c
        text: "config qos reload, then show pfc counters"
        explanation: "These are SONiC commands, not Cumulus NVUE."
      - id: d
        text: "nv set qos roce, then nv show qos roce, with no apply needed"
        explanation: "NVUE changes are staged until applied with nv config apply."
    tags: [cumulus, nvue]
  - id: q4
    type: scenario
    prompt: "A fabric mixes SONiC leaves running community default QoS templates with NVIDIA-convention hosts (DSCP 26 to priority 3). PFC works on some links and not others. What is the best fix?"
    options:
      - id: a
        text: "Define one QoS contract and configure every NOS and host to it explicitly, including DSCP maps and pfc_enable."
        correct: true
        explanation: "SONiC defaults have traditionally used different lossless priorities and DSCP maps. Mixed defaults cause inconsistent classification."
      - id: b
        text: "Disable PFC on all SONiC devices and rely on ECN alone, so that the inconsistent maps no longer matter."
        explanation: "That turns the class lossy on those hops, and the inconsistent maps still put RoCE in the wrong queues."
      - id: c
        text: "Change the hosts to trust PCP, so that classification no longer depends on each switch's DSCP map."
        explanation: "Host trust mode does not align the switch maps, and PCP-based classification breaks on untagged routed links."
      - id: d
        text: "Raise the ECN thresholds on the SONiC leaves so that they mark later, matching the NVIDIA host defaults better."
        explanation: "Thresholds do not fix packets landing in the wrong priority."
    tags: [sonic, consistency]
  - id: q5
    type: multi
    prompt: "Which observations during a stage-2 incast test indicate a healthy RoCE configuration? (Select all that apply.)"
    options:
      - id: a
        text: "Receiver np_ecn_marked_roce_packets and np_cnp_sent rise, and senders' rp_cnp_handled rises."
        correct: true
        explanation: "This shows the full DCQCN loop working: marking, notification and reaction."
      - id: b
        text: "RoCE bytes appear in rx_prio3_bytes on the receiver."
        correct: true
        explanation: "This confirms the traffic is classified into the lossless priority."
      - id: c
        text: "out_of_sequence and packet_seq_err stay flat."
        correct: true
        explanation: "Flat sequence-error counters indicate no loss."
      - id: d
        text: "The receiver's tx_prio3_pause rises steadily throughout the test."
        explanation: "A host sending continuous pauses means its receive path cannot keep up, which is a problem."
    tags: [validation, counters]
  - id: q6
    type: scenario
    prompt: "In a server with eight back-end NICs, nccl-tests all-reduce bandwidth is low, and per-NIC counters show retransmissions and sequence errors only on mlx5_5. The other seven NICs are clean. What is the most likely cause?"
    options:
      - id: a
        text: "Host QoS (trust, PFC or ECN) or MTU was not applied to mlx5_5, or its rail's switch port is off-contract."
        correct: true
        explanation: "Configuration that misses one NIC or one rail is common. The collective then runs at the speed of the bad rail."
      - id: b
        text: "NCCL_IB_TC is set per NIC and is missing for mlx5_5, so its QPs use the default priority 0."
        explanation: "NCCL_IB_TC applies to all NCCL QPs in the process, not per NIC."
      - id: c
        text: "All-reduce always stresses one NIC more than the others, and in this topology mlx5_5 is the busiest by design."
        explanation: "Rail-optimised all-reduce spreads traffic evenly across NICs. Errors on one NIC indicate a fault there."
      - id: d
        text: "The GPUs attached to mlx5_5 are slower, so its queue pairs time out and retransmit more often."
        explanation: "Slower GPUs reduce how fast data is produced; they do not cause sequence errors or retransmissions on the NIC."
    tags: [rails, validation]
  - id: q7
    type: single
    prompt: "Why is a continuous static audit (stage 0) part of the validation plan rather than a one-time step?"
    options:
      - id: a
        text: "Configuration drifts: reimaged hosts, replaced switches and firmware upgrades can silently revert it."
        correct: true
        explanation: "Continuous auditing catches drift before a training job suffers."
      - id: b
        text: "PFC and DSCP settings on the NICs expire after a fixed lease time and must be renewed by a periodic job."
        explanation: "PFC settings do not expire. They are lost on reboot or reset, or changed by drift."
      - id: c
        text: "Audits feed the cable lengths that the switch needs to recompute headroom whenever a link flaps."
        explanation: "Headroom comes from speed, cable length and MTU configured on the switch. A link flap does not require an audit."
      - id: d
        text: "NCCL checks the audit timestamp at start-up and refuses to run if the last audit is too old."
        explanation: "NCCL has no such dependency on audits."
    tags: [automation, operations]
