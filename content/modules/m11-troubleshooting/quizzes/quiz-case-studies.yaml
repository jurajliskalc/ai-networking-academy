id: quiz-case-studies
title: "Knowledge check: AI fabric case studies"
lesson: case-studies
pass_pct: 70
questions:
  - id: q1
    type: scenario
    prompt: |
      A large InfiniBand training job has been 15% slower for a day. An error sweep shows one spine port with:
        SymbolErrorCounter rising by thousands per minute, PortRcvErrors rising, LinkDownedCounter = 2
      All other ports are near zero. A leaf port shows a few PortXmitDiscards. What is the root cause and best mitigation?
    options:
      - id: a
        text: A degrading optic or connector on the spine link; save the counters, disable the link so traffic reroutes, then replace the optic and clean the fibre.
        correct: true
        explanation: Rising symbol and receive errors plus flaps on a single port point to the physical layer. The leaf discards are a side effect of the flaps.
      - id: b
        text: Congestion on the leaf, shown by its PortXmitDiscards; raise the buffer allocation on that leaf port so it stops discarding, then re-test.
        explanation: The discards are few and follow from the failing link; buffer tuning would not stop the symbol errors on the spine port.
      - id: c
        text: The Subnet Manager computed bad routes after the link flaps; restart the SM so it re-sweeps the fabric and rebalances the routing tables.
        explanation: Routing does not create symbol errors. Restarting the SM would add churn without fixing the link.
      - id: d
        text: Clear all counters fabric-wide, then watch for a day to confirm the errors are real before touching any hardware or routing.
        explanation: Clearing first destroys evidence, and the job keeps suffering meanwhile; the pattern is already clear.
    tags: [infiniband, optics, ber]
  - id: q2
    type: scenario
    prompt: >
      Right after a QoS template push, MoE jobs lose 40% throughput while dense jobs are barely affected.
      Switch PFC counters for the RoCE priority dropped to zero at the push time, ECN marks continue, and
      receivers show out_of_sequence climbing. What happened?
    options:
      - id: a
        text: PFC now covers a priority RoCE does not use, so RoCE runs lossy and all-to-all incast overflows buffers before ECN can react.
        correct: true
        explanation: Zero pauses on the RoCE priority, continued ECN, and receiver sequence gaps after a change point to a PFC priority mismatch.
      - id: b
        text: The push triggered a PFC storm; a stuck receiver keeps pausing its upstream ports and the pause spreads across the whole fabric.
        explanation: A storm would show very high pause counts on the RoCE priority, not zero.
      - id: c
        text: The template changed the ECMP hash inputs, polarizing flows so the all-to-all traffic piles onto a few uplinks and drops.
        explanation: A QoS template does not change hash inputs, and polarization causes uneven utilisation, not a sudden disappearance of PFC pauses on the RoCE priority.
      - id: d
        text: A software regression in the MoE all-to-all code path, which dense jobs barely exercise; the push timing is coincidental.
        explanation: The timing matches the push, and the fabric counters changed in a way that explains the symptom.
    tags: [pfc, change-correlation]
  - id: q3
    type: single
    prompt: >
      In Case 2, a configuration push left PFC enabled on the wrong priority, so RoCE traffic ran without PFC
      while ECN/DCQCN stayed on. Mixture-of-experts jobs (heavy all-to-all) slowed badly; dense-model jobs
      barely changed. Why did the dense-model jobs suffer much less?
    options:
      - id: a
        text: Their traffic had less incast, so ECN/DCQCN alone usually kept queues short enough to avoid overflow without PFC.
        correct: true
        explanation: ECN reacts after a round trip; it can manage gentle congestion but not fast-filling incast bursts like all-to-all.
      - id: b
        text: Dense models do not use RDMA for gradients; they go over TCP sockets, which recover from drops by retransmission.
        explanation: They use the same NCCL RDMA transports as the MoE jobs.
      - id: c
        text: Dense models use a different DSCP, and that DSCP still mapped to the priority that had PFC enabled.
        explanation: Both job types used the same RoCE configuration; the difference was the traffic pattern.
    tags: [ecn, incast]
  - id: q4
    type: scenario
    prompt: >
      nccl-tests busbw on a RoCE fabric varies between 55% and 95% of baseline across reruns, with no
      errors or drops. Telemetry shows that for each spine-leaf pair one of two parallel links is near
      95% utilised and the other near 20%. Which combination best explains this?
    options:
      - id: a
        text: Too few large flows for static hashing (low entropy), plus polarization from leaf and spine sharing one hash function and seed.
        correct: true
        explanation: Few elephants collide, and identical hashing across tiers makes the spine's choice depend on bits the leaf already fixed.
      - id: b
        text: A marginal optic on each busy link; corrupted frames are resent, inflating its utilisation while the twin link stays quiet.
        explanation: Bad optics produce error counters and retransmissions; here there are no errors or drops.
      - id: c
        text: PFC is disabled, so packets are dropped and go-back-N retransmissions inflate traffic on the busiest links.
        explanation: There are no drops; the issue is distribution, not loss.
      - id: d
        text: The NICs' PCIe links are downtrained, so some hosts inject at half rate and the links they use look underutilised.
        explanation: Downtraining would show as a node-dependent persistent drop, not as uneven switch link utilisation that changes between reruns.
    tags: [ecmp, polarization]
  - id: q5
    type: multi
    prompt: >
      In Case 3, a RoCE fabric showed a few spine uplinks saturated while others sat idle: each NIC pair used a
      single QP, so the 5-tuples had little entropy, and every switch tier used the same hash function
      (polarization). Which actions address the root cause? (Select all that apply.)
    options:
      - id: a
        text: Use a different hash seed (or function) per switching tier.
        correct: true
        explanation: This removes the correlation between the leaf's and the spine's choices, which is the polarization mechanism.
      - id: b
        text: Increase the number of QPs per connection (for example NCCL_IB_QPS_PER_CONNECTION) to raise flow entropy.
        correct: true
        explanation: More QPs means more distinct UDP source ports, giving the hash more flows to spread; measure the resource cost.
      - id: c
        text: Evaluate adaptive routing or packet spraying on platforms that support it.
        correct: true
        explanation: Load-aware path selection avoids the limits of static hashing for elephant flows.
      - id: d
        text: Lower the PFC XOFF threshold on the hot links.
        explanation: This changes when pauses are sent but does nothing about how flows are distributed.
    tags: [ecmp, remediation]
  - id: q6
    type: scenario
    prompt: >
      A node returned after a GPU tray replacement passes DCGM diagnostics. A 32-node job including it is
      22% slower. Parallel bisection isolates the node; per-rail ib_write_bw to a golden node shows one rail
      at about half of line rate. What is the next command, and what do you expect to see?
    options:
      - id: a
        text: lspci -vv for that rail's NIC under load, expecting LnkSta width or speed below LnkCap (for example x8 instead of x16).
        correct: true
        explanation: A single rail at about half bandwidth after hardware work is the classic signature of a NIC PCIe link trained at half width.
      - id: b
        text: nvidia-smi -q -d PERFORMANCE, expecting thermal or power throttling on the GPU paired with that rail.
        explanation: Throttling would slow compute, not one NIC rail in a network bandwidth test.
      - id: c
        text: show_gids on that rail's NIC, expecting the configured GID index to hold a RoCE v1 entry instead of v2.
        explanation: A wrong GID type or index causes connection failures, not a connection that works at half bandwidth.
      - id: d
        text: perfquery on the leaf port facing that rail, expecting PortXmitWait to climb because the switch is congested.
        explanation: A single test stream from one node to a golden node does not congest the switch; one rail stuck at half rate after hardware work points at the host side.
    tags: [pcie, admission]
  - id: q7
    type: scenario
    prompt: >
      After a host network change that is applied at reboot, about 60% of new jobs fail with NCCL
      "status=12" errors, while running jobs are fine. Every failing job includes at least one node
      rebooted since the change. What should you compare first?
    options:
      - id: a
        text: The GID entry (type and address) at the configured GID index on a rebooted versus a non-rebooted node.
        correct: true
        explanation: The partial-reboot pattern plus retry-exceeded errors points to GID table drift on rebooted nodes.
      - id: b
        text: Switch PFC and ECN configuration on the racks hosting the failing nodes, looking for a mismatched priority.
        explanation: Nothing changed on the switches, and a PFC problem would not correlate with host reboots.
      - id: c
        text: GPU clock throttle reasons on the failing nodes, since slow ranks can trip NCCL timeouts.
        explanation: Throttling makes jobs slow, not fail with transport retry-exceeded errors, and it does not track reboots.
      - id: d
        text: The NCCL version on the failing nodes, since a library mismatch between ranks breaks setup.
        explanation: The change was to host networking; the reboot correlation points at addressing, not at the library.
    tags: [gid, change-correlation]
  - id: q8
    type: single
    prompt: Which prevention item is the strongest outcome of an incident report?
    options:
      - id: a
        text: An owned, dated automated check (alert, admission test or CI guardrail) that would have caught this incident earlier.
        correct: true
        explanation: Automated checks prevent recurrence regardless of who is on call.
      - id: b
        text: A reminder to all engineers to be more careful with config pushes, added to the team runbook and onboarding notes.
        explanation: Exhortations do not change the system and rarely prevent recurrence.
      - id: c
        text: A record of which engineer made the change, so that person can be retrained and all of their future pushes reviewed.
        explanation: Blameless reports focus on how the system allowed the failure, not on individuals.
      - id: d
        text: Higher NCCL timeouts across the fleet, so transient fabric faults no longer kill running jobs.
        explanation: This hides symptoms and slows detection; it prevents nothing.
    tags: [postmortem]
