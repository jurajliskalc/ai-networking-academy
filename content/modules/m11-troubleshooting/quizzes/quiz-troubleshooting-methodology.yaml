id: quiz-troubleshooting-methodology
title: "Knowledge check: troubleshooting methodology"
lesson: troubleshooting-methodology
pass_pct: 70
questions:
  - id: q1
    type: scenario
    prompt: >
      A 1,024-GPU job's step time rose 25% overnight. Before anyone investigates, an engineer
      proposes rebooting the 12 nodes the framework watchdog named in its timeout messages "to get
      the job running again". What should happen first?
    options:
      - id: a
        text: Preserve evidence on those nodes (NCCL logs, ethtool and RDMA counter snapshots, kernel log) and hold automatic remediation.
        correct: true
        explanation: A reboot destroys counters, kernel messages and transient state. Capture them first; then remediation is safe.
      - id: b
        text: Reboot them; counters reset on reboot anyway, so nothing of value is lost.
        explanation: That counters reset is exactly the problem. The pre-reboot values and kernel log are the evidence.
      - id: c
        text: Raise the NCCL timeout so the job stops failing, then investigate later.
        explanation: This masks the fault and the job remains 25% slower; it is at best a documented temporary mitigation.
      - id: d
        text: Clear the switch counters fabric-wide so the investigation starts from a clean baseline.
        explanation: Clearing counters destroys history. Use deltas between snapshots instead of resets.
    explanation: Stabilize and preserve evidence before changing anything.
    tags: [methodology, evidence]
  - id: q2
    type: scenario
    prompt: >
      In a rail-optimized cluster with 8 GPUs per server, NCCL reports that ranks 5, 13, 21, 29, 37
      and 45 (GPU index 5 on six different servers) are consistently the slowest. Other ranks on the
      same servers are normal. Where do you look first?
    options:
      - id: a
        text: The rail-5 leaf and spine path shared by those NICs.
        correct: true
        explanation: Each server's GPU 5 / NIC 5 connects to rail 5. A pattern across servers on one GPU index points at shared rail-5 infrastructure.
      - id: b
        text: The six servers' GPUs, starting with a full dcgmi diag on each.
        explanation: Six independent GPU faults all on index 5 is far less likely than one shared rail component. Test the rail first.
      - id: c
        text: The storage network, because checkpoints slow down specific ranks.
        explanation: Checkpointing would not select exactly the GPU-5 ranks; the pattern matches rail topology.
      - id: d
        text: The NCCL version, because algorithm selection differs by rank.
        explanation: A software version issue would not single out one GPU index on otherwise identical servers.
    explanation: Translate ranks to physical locations; rail patterns and host patterns look different.
    tags: [methodology, scoping, rail-optimized]
  - id: q3
    type: scenario
    prompt: >
      A suspect port shows rx_prio3_pause = 9,800,000. A healthy peer shows 9,200,000. The node was
      installed 210 days ago. What can you conclude?
    options:
      - id: a
        text: Nothing yet; take two snapshots during the bad window and compare the rate with healthy peers.
        correct: true
        explanation: Cumulative totals over months say nothing about the incident window. Rates over the same interval are the evidence.
      - id: b
        text: The suspect port is the root cause because it has more pause frames.
        explanation: A 6% difference in lifetime totals is noise; it may come from months-old events.
      - id: c
        text: PFC is misconfigured on both nodes because any pause is a fault.
        explanation: Pause is normal in a lossless fabric under load. Its rate and context matter.
      - id: d
        text: The counter wrapped, so the values must be reset before analysis.
        explanation: There is no evidence of a wrap, and resetting destroys evidence. Use deltas.
    tags: [counters, deltas]
  - id: q4
    type: single
    prompt: Why does a single half-speed link have such a large effect on a ring all-reduce?
    options:
      - id: a
        text: Every step of the ring waits for the slowest transfer, so the slowest link gates the whole collective.
        correct: true
        explanation: Synchronous collectives proceed in lockstep; the critical path is set by the slowest participant.
      - id: b
        text: NCCL retransmits all data on every link when one link is slow.
        explanation: NCCL does not retransmit data over healthy links because one is slow; the issue is waiting, not retransmission.
      - id: c
        text: The subnet manager reroutes all traffic onto the slow link.
        explanation: Routing does not deliberately concentrate traffic on a degraded link.
      - id: d
        text: ECMP hashing sends every flow through the slow link.
        explanation: ECMP spreads flows; the impact comes from synchronization, not from hashing everything onto one link.
    tags: [collectives, stragglers]
  - id: q5
    type: multi
    prompt: Which practices make a bisection test conclusive? (Select all that apply.)
    options:
      - id: a
        text: Running the same test on a known-good set of nodes as a control.
        correct: true
        explanation: Without a control you cannot tell "slow" from "normal for this platform".
      - id: b
        text: Holding NCCL version, environment variables and message sizes constant between runs.
        correct: true
        explanation: Changing several variables at once makes it impossible to attribute the difference.
      - id: c
        text: Choosing tests that split the suspect set roughly in half.
        correct: true
        explanation: That maximizes the information each test gives, like a binary search.
      - id: d
        text: Applying a candidate fix at the same time as the test to save time.
        explanation: Overlapping fixes and tests destroys attribution; one change at a time.
    tags: [bisection]
  - id: q6
    type: scenario
    prompt: >
      At 13:35 a QoS template was pushed to pod B leaves. From 13:40 jobs in pod B are 30% slower;
      pod A jobs are unaffected. A firmware update was also applied to four pod B hosts at 13:20.
      Which next step best proves the cause?
    options:
      - id: a
        text: Roll back the QoS template on one leaf pair and rerun nccl-tests across that pair against a pod-A control.
        correct: true
        explanation: Reverting the leading suspect on a small blast radius and verifying with the same test proves or refutes it without affecting everything.
      - id: b
        text: Roll back both the template and the firmware everywhere at once.
        explanation: This may fix it, but you will not know which change was responsible, and the blast radius is large.
      - id: c
        text: Declare the template the root cause based on timing and close the incident.
        explanation: Correlation is a lead, not proof. Two changes happened; only a test can separate them.
      - id: d
        text: Wait to see whether the problem resolves on its own overnight.
        explanation: Waiting wastes cluster time and gathers no new evidence.
    tags: [change-correlation]
  - id: q7
    type: single
    prompt: Which result best verifies that an incident is fixed?
    options:
      - id: a
        text: The test that showed the fault now passes, and the production metric (step time or bus bandwidth) is back at baseline.
        correct: true
        explanation: Verification means the original symptom and evidence are gone, measured the same way.
      - id: b
        text: The suspected component was replaced.
        explanation: Replacing a part does not prove it was the cause; the symptom might persist.
      - id: c
        text: Switch error counters are zero after being cleared.
        explanation: Freshly cleared counters are zero by definition; they prove nothing until traffic runs.
      - id: d
        text: No new alerts fired in the last ten minutes.
        explanation: Absence of alerts is weak evidence; alerts may not cover the failure mode.
    tags: [verification]
  - id: q8
    type: scenario
    prompt: >
      nccl-tests between two nodes reach only a small fraction of the expected bus bandwidth, latency
      is poor at every size, and the NCCL INFO log shows the network transport as socket-based rather
      than IB/RoCE. Switch counters are clean. What is the most likely area to investigate?
    options:
      - id: a
        text: NCCL transport selection and RDMA availability on the hosts (plugin, devices, environment).
        correct: true
        explanation: Falling back to sockets points at NCCL not finding or not being allowed to use RDMA devices; that is a host/configuration issue.
      - id: b
        text: Spine buffer sizes, because small messages are dropped first.
        explanation: Buffer drops would not change the transport NCCL reports in its init log.
      - id: c
        text: Fibre cleanliness on the leaf ports.
        explanation: Link errors cause retransmissions and drops, not a transport fallback reported at init.
      - id: d
        text: The subnet manager routing algorithm.
        explanation: Routing affects paths, not whether NCCL chooses sockets.
    explanation: Read the NCCL init log early; it tells you which transport is in use.
    tags: [nccl, transport]
