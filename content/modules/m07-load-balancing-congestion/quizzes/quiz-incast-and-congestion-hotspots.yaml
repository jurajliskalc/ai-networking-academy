id: quiz-incast-and-congestion-hotspots
title: "Knowledge check: incast and congestion hotspots"
lesson: incast-and-congestion-hotspots
pass_pct: 70
questions:
  - id: q1
    type: single
    prompt: "Eight senders at 400 Gb/s each send simultaneously to one 400 Gb/s receiver port. How fast does the egress queue grow?"
    options:
      - id: a
        text: "About 350 KB per microsecond (2.8 Tb/s of excess)."
        correct: true
        explanation: "Excess = (8-1) x 400 Gb/s = 2.8 Tb/s = 350 GB/s = 350 KB per microsecond."
      - id: b
        text: "About 400 KB per microsecond (3.2 Tb/s of excess)."
        explanation: "This forgets that the port drains at 400 Gb/s while it fills."
      - id: c
        text: "About 50 KB per microsecond."
        explanation: "That is the excess for only two senders."
      - id: d
        text: "It does not grow because ECN prevents queue build-up."
        explanation: "ECN-based congestion control needs at least one RTT to react; the queue grows first."
    tags: [incast, math]
  - id: q2
    type: single
    prompt: "Which statement best distinguishes endpoint (last-hop) congestion from fabric congestion?"
    options:
      - id: a
        text: "Endpoint congestion is demand toward one destination port exceeding its rate, which no choice of path can fix."
        correct: true
        explanation: "Load balancing redistributes traffic among paths; it cannot add capacity to the last link."
      - id: b
        text: "Endpoint congestion only happens on InfiniBand, where credit flow control pushes it back to the senders."
        explanation: "Incast affects any fabric technology, Ethernet included."
      - id: c
        text: "Fabric congestion always happens on host-facing ports, while endpoint congestion sits on the leaf-to-spine links."
        explanation: "It is the other way round: fabric congestion happens on uplinks and spine links; host-facing ports are the last hop."
      - id: d
        text: "Endpoint congestion is the kind that adaptive routing solves, by moving flows to less-loaded uplinks."
        explanation: "Adaptive routing solves fabric hotspots, not incast: every path still ends at the same overloaded port."
    tags: [congestion]
  - id: q3
    type: scenario
    prompt: "Host H on leaf 2 sends only to receiver Q, which is idle. During another job's incast toward receiver R on leaf 1, H's traffic stalls and H's NIC counts many received pause frames on the RoCE priority. What is happening?"
    options:
      - id: a
        text: "PFC pauses spreading back from R's congested port form a congestion tree; H's flow is a victim on the paused priority."
        correct: true
        explanation: "PFC pauses a whole priority on a link, so unrelated flows on that priority stop too (head-of-line blocking)."
      - id: b
        text: "Q is sending pause frames back through the fabric because its NIC receive buffer is overloaded by H's traffic."
        explanation: "Q is idle and receives only H's traffic; the pauses originate from the congestion near R."
      - id: c
        text: "H's NIC is faulty and generating pause storms that its own counters report as received pauses."
        explanation: "Received and transmitted pauses are counted separately. H is receiving pauses, not transmitting them, so it is a victim, not the source."
      - id: d
        text: "ECMP polarization placed H's flow on the same uplink as the incast traffic toward R, which starves it of all bandwidth."
        explanation: "Sharing a link alone would only reduce bandwidth; the stall and received pauses point to PFC propagation."
    tags: [pfc, victim-flows]
  - id: q4
    type: scenario
    prompt: "During incast tests you see frequent PFC pauses, almost no ECN-marked packets and DCQCN CNP counters near zero. What is the most likely misconfiguration?"
    options:
      - id: a
        text: "ECN marking thresholds are set above the PFC XOFF point, so PFC fires before marking starts."
        correct: true
        explanation: "Marking must begin well below XOFF so congestion control engages before pauses."
      - id: b
        text: "The PFC watchdog is disabled, so PFC keeps firing instead of handing control to ECN."
        explanation: "The watchdog handles storms by dropping or ignoring pauses; it does not hand control to ECN and does not explain why ECN never marks."
      - id: c
        text: "ECMP hashing excludes the UDP source port, so flows collide on a few uplinks and saturate them."
        explanation: "Collisions would still produce ECN marks if marking started below XOFF. Hash fields affect path selection, not the ordering of ECN and PFC thresholds."
      - id: d
        text: "The MTU is set to 9000 bytes, so each packet consumes too much buffer for marking to engage."
        explanation: "MTU does not determine whether ECN marks before PFC triggers."
    tags: [ecn, pfc, tuning]
  - id: q5
    type: multi
    prompt: "Which AI workload phases are prone to incast? (Select all that apply.)"
    options:
      - id: a
        text: "MoE expert-parallel all-to-all with uneven token routing."
        correct: true
        explanation: "Hot experts receive from many ranks at once."
      - id: b
        text: "Checkpoint writes from many GPUs to a few storage nodes."
        correct: true
        explanation: "Storage nodes often have far less network bandwidth than the compute side sending to them."
      - id: c
        text: "Ring all-reduce, where each rank receives from one neighbour."
        explanation: "Ring is incast-free by construction: one sender per receiver."
      - id: d
        text: "Fan-in at tree levels of a reduce operation."
        correct: true
        explanation: "Several children send to one parent, a bounded form of incast."
    tags: [workloads, incast]
  - id: q6
    type: scenario
    prompt: "One server's NIC transmits large numbers of PFC pause frames toward its leaf, while other servers in the same job transmit almost none. Switch queues toward that server are not unusually deep. Where do you look first?"
    options:
      - id: a
        text: "Inside the server: GPU-NIC PCIe placement, PCIe/IOMMU settings, or anything slowing NIC writes to memory."
        correct: true
        explanation: "A NIC sends pauses when its own receive buffers fill, which points to a host-side bottleneck."
      - id: b
        text: "The spine ECMP hash configuration, which may be steering too many flows toward that server."
        explanation: "Hashing picks fabric paths, not destinations, and would not make a NIC emit pauses while switch queues toward it stay normal."
      - id: c
        text: "The ECN thresholds on the spine switches, which may be set too high to slow down the senders in time."
        explanation: "The bottleneck is at the receiving host, not in the fabric queues, which are not unusually deep."
      - id: d
        text: "The leaf's routing table, which may be wrongly sending traffic from other jobs to that server's port as well."
        explanation: "Misrouted traffic would deepen the switch queues toward that port, which are normal here. The pauses come from the NIC's own receive path."
    tags: [troubleshooting, host]
  - id: q7
    type: single
    prompt: "Why do lossless RoCE fabrics still need PFC even with well-tuned ECN-based congestion control?"
    options:
      - id: a
        text: "A large incast can fill the available buffer faster than one RTT, before senders react to ECN feedback."
        correct: true
        explanation: "PFC is the backstop that prevents drops during the reaction delay of end-to-end congestion control."
      - id: b
        text: "ECN is an InfiniBand mechanism, so on Ethernet RoCE needs PFC as its only congestion signal."
        explanation: "ECN is an IP mechanism (RFC 3168) used by DCQCN on Ethernet."
      - id: c
        text: "PFC spreads the load across the spines by pausing the busiest uplinks so that the traffic shifts to idle ones."
        explanation: "PFC does not influence path selection; it only pauses a priority on one link."
      - id: d
        text: "RoCEv2 forbids switches from ECN-marking its packets, because the ICRC would then fail."
        explanation: "RoCEv2 congestion control (e.g. DCQCN) depends on ECN marks, and the ICRC masks the ECN bits so marking is safe."
    tags: [pfc, ecn]
