id: quiz-inference-networking
title: "Knowledge check: inference networking"
lesson: inference-networking
pass_pct: 70
questions:
  - id: q1
    type: single
    prompt: Which statement correctly contrasts the prefill and decode phases of LLM inference?
    options:
      - id: a
        text: Prefill processes the whole prompt in parallel and is compute-bound; decode emits one token per step, bound by memory bandwidth and latency.
        correct: true
        explanation: This difference drives separate optimisation, and sometimes separate GPU pools.
      - id: b
        text: Prefill computes gradients for the prompt, and decode then applies those gradients to the weights before emitting each token.
        explanation: Inference has no gradients or weight updates.
      - id: c
        text: Prefill runs on the front-end network while the request is parsed, and decode runs on the storage network as tokens are fetched.
        explanation: Both phases run on GPUs; the phases are computational, not network names.
      - id: d
        text: Decode processes the whole prompt in parallel and is compute-bound; prefill then generates the output tokens one by one.
        explanation: The roles are reversed.
    tags: [prefill, decode]
  - id: q2
    type: single
    prompt: A model has 80 layers, 8 KV heads, head dimension 128 and stores the KV cache in BF16. About how large is the KV cache for an 8,192-token prompt?
    options:
      - id: a
        text: About 2.7 GB.
        correct: true
        explanation: 2 x 80 x 8 x 128 x 2 bytes = 327,680 bytes per token; times 8,192 tokens is about 2.7 GB.
      - id: b
        text: About 2.7 MB.
        explanation: That is a thousand times too small; the per-token cost alone is about 320 KiB.
      - id: c
        text: About 140 GB.
        explanation: That is the size of the BF16 weights of a 70B model, not the KV cache of one prompt.
      - id: d
        text: About 320 KB.
        explanation: That is the per-token size, not the total for 8,192 tokens.
    tags: [kv-cache]
  - id: q3
    type: scenario
    prompt: >
      A team moves a 70B model from 8-way tensor parallelism within one server to 16-way tensor parallelism across two
      servers connected by a 400 Gb/s RoCE fabric. Throughput is similar, but inter-token latency gets much worse.
      Why?
    options:
      - id: a
        text: Decode-time TP all-reduces are small and latency-bound, run several times per layer for every token, and now cross the scale-out fabric.
        correct: true
        explanation: The scale-out fabric has lower bandwidth and higher latency than NVLink, and per-collective latency is multiplied by the number of all-reduces per token, so each microsecond matters.
      - id: b
        text: The KV cache no longer fits on the GPUs once it is split 16 ways, so every token has to re-read it from host memory.
        explanation: More GPUs means more total memory, not less; each GPU's share of the KV cache shrinks.
      - id: c
        text: The front-end load balancer now has to split every request between the two servers, adding a network round trip per token.
        explanation: The front-end routes requests to a replica; it is not involved in intra-replica collectives or per-token work.
      - id: d
        text: RoCE cannot carry all-reduce traffic efficiently, so NCCL falls back to TCP sockets on the front-end for the TP group.
        explanation: RoCE carries collectives routinely; the issue is latency per operation, not an inability to run all-reduce.
    tags: [tensor-parallel, latency]
  - id: q4
    type: single
    prompt: In disaggregated serving, what must move over the network between the prefill and decode GPU pools?
    options:
      - id: a
        text: The KV cache produced by prefill for each request.
        correct: true
        explanation: The decode workers need the prompt's keys and values to continue generating tokens.
      - id: b
        text: The model gradients.
        explanation: Inference computes no gradients.
      - id: c
        text: Nothing; both pools recompute the prompt independently.
        explanation: Recomputing would waste the point of a separate prefill pool.
      - id: d
        text: The full model weights on every request.
        explanation: Weights stay resident on each pool's GPUs.
    tags: [disaggregated-serving]
  - id: q5
    type: scenario
    prompt: >
      After enabling disaggregated serving, median TTFT increased by about 60 ms for 8k-token prompts. Each prefill
      node has 400 Gb/s per GPU to the compute fabric, and the KV cache is sent only after prefill completes. What is
      the most effective change?
    options:
      - id: a
        text: Stream each layer's KV cache as soon as it is computed, overlapping the transfer with prefill, over a fast RDMA path between nearby pools.
        correct: true
        explanation: A 2.7 GB transfer at 50 GB/s is about 54 ms; overlapping hides most of it behind prefill compute.
      - id: b
        text: Send the KV cache over the front-end network using HTTP, which avoids setting up an RDMA connection for every single request.
        explanation: That path is usually slower and adds protocol overhead; the 60 ms is the serialised bulk transfer, not connection setup.
      - id: c
        text: Reduce the MTU to 1500 so that the first packets of the KV cache reach the decode node sooner and TTFT drops.
        explanation: Smaller packets reduce efficiency for a bulk transfer, and decode needs the whole cache, so earlier first packets do not address the serialised design.
      - id: d
        text: Disable prefix caching so that the decode pool recomputes the prompt itself instead of waiting for the KV transfer.
        explanation: Prefix caching reduces work, and disabling it does not make decode recompute the prompt; it would only make TTFT worse.
    tags: [kv-transfer, ttft]
  - id: q6
    type: multi
    prompt: Which are valid reasons the front-end network matters more for inference than for training? Select all that apply.
    options:
      - id: a
        text: User requests and streamed token responses arrive and leave through it.
        correct: true
        explanation: For inference the front-end is the product's delivery path.
      - id: b
        text: Routing must consider KV cache locality and per-worker load, not just round-robin.
        correct: true
        explanation: KV-aware routing increases cache hits and reduces TTFT.
      - id: c
        text: Model weights may be loaded over it (or the storage path) during autoscaling cold starts.
        correct: true
        explanation: Hundreds of GB per replica make cold-start bandwidth significant.
      - id: d
        text: Gradient all-reduce for inference runs over the front-end.
        explanation: Inference has no gradients.
    tags: [front-end]
  - id: q7
    type: single
    prompt: Why is all-to-all latency particularly important when serving large mixture-of-experts models?
    options:
      - id: a
        text: Every decode step performs expert dispatch and combine all-to-alls, so their latency adds to every generated token.
        correct: true
        explanation: Small, uneven, latency-bound all-to-alls on every token make fabric latency and congestion visible to users.
      - id: b
        text: MoE models use no other communication at all, so all-to-all latency is the only network cost users see.
        explanation: They may also use TP and other collectives; all-to-all is the distinctive one.
      - id: c
        text: All-to-all is used only while loading the experts onto the GPUs, so its latency decides how long each cold start takes.
        explanation: It is used in every forward pass through MoE layers, not only during loading.
      - id: d
        text: Experts are fine-tuned on each request, and the all-to-all carries their updated weights back to every GPU.
        explanation: Inference does not retrain or fine-tune experts; all-to-all carries tokens, not weights.
    tags: [moe, all-to-all]
