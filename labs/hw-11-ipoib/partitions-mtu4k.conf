# hw-11-ipoib: OpenSM partition configuration that only changes the IPoIB broadcast group of the
# default partition: mtu=5 is the InfiniBand MTU code for 4096 bytes (4 = 2048, OpenSM's default).
# Every port stays a full member, as without a partition file.
Default=0x7fff, ipoib, mtu=5 : ALL=full ;
