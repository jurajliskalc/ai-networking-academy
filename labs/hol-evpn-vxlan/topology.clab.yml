# hol-evpn-vxlan: BGP EVPN with VXLAN on FRR. 1 spine, 2 leaves (VTEPs), 2 hosts in one L2 segment.
#
#                 spine1 (AS 65000, lo 10.0.0.1)
#                eth1 /         \ eth2
#               eth1 /           \ eth1
#   leaf1 (AS 65101, VTEP 10.0.0.11)   leaf2 (AS 65102, VTEP 10.0.0.12)
#               eth2 |           | eth2        br100 + vxlan100 (VNI 100) on each leaf
#               eth1 |           | eth1
#   h1 192.168.100.11/24        h2 192.168.100.12/24
#
# Deploy:  sudo containerlab deploy -t topology.clab.yml && sudo ./vxlan-setup.sh
# Destroy: sudo containerlab destroy -t topology.clab.yml --cleanup
#
# The FRR image tag is pinned on purpose. If it cannot be pulled, pick another
# released tag from https://quay.io/repository/frrouting/frr?tab=tags.
name: hol-evpn

topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.2.1

  nodes:
    spine1:
      kind: linux
      binds:
        - config/daemons:/etc/frr/daemons
        - config/vtysh.conf:/etc/frr/vtysh.conf
        - config/spine1/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.disable_ipv6=0
        - sysctl -w net.ipv4.conf.all.rp_filter=0
    leaf1:
      kind: linux
      binds:
        - config/daemons:/etc/frr/daemons
        - config/vtysh.conf:/etc/frr/vtysh.conf
        - config/leaf1/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.disable_ipv6=0
        - sysctl -w net.ipv4.conf.all.rp_filter=0
    leaf2:
      kind: linux
      binds:
        - config/daemons:/etc/frr/daemons
        - config/vtysh.conf:/etc/frr/vtysh.conf
        - config/leaf2/frr.conf:/etc/frr/frr.conf
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - sysctl -w net.ipv6.conf.all.disable_ipv6=0
        - sysctl -w net.ipv4.conf.all.rp_filter=0

    h1:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 192.168.100.11/24 dev eth1
    h2:
      kind: linux
      image: alpine:3.20
      exec:
        - ip addr add 192.168.100.12/24 dev eth1

  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["leaf1:eth2", "h1:eth1"]
    - endpoints: ["leaf2:eth2", "h2:eth1"]
