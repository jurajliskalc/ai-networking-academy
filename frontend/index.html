<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="author" content="Juraj Liska" />
    <meta name="copyright" content="© 2026 Juraj Liska. Noncommercial use only: code PolyForm Noncommercial 1.0.0, content CC BY-NC-SA 4.0." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Networking Academy: from beginner to master in AI cluster networking. RDMA, InfiniBand, RoCEv2, lossless Ethernet, NCCL and rail-optimized fabrics, with simulators and labs." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>AI Networking Academy</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = JSON.parse(localStorage.getItem('aina.progress.v1') || '{}').settings?.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { document.documentElement.classList.add('dark'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
